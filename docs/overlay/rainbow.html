<html lang="en">
<head>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --accent: #c080ff;
            --accent-rgb: 192, 128, 255;
            --accent-light: color-mix(in srgb, var(--accent) 65%, white);
            --stat-label-color: #ffffff;
        }

        body {
            background: transparent;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* size your OBS browser source to ~90px tall so the buttons below stay hidden */
        .overlay-container {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            background: linear-gradient(180deg, rgba(20,18,26,0.95) 0%, rgba(12,11,16,0.95) 100%);
            padding: 24px 46px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            user-select: none;
        }

        .section { display: flex; flex-direction: column; justify-content: center; }
        .left-section  { align-items: center; padding-right: 40px; }
        .right-section { align-items: center; padding-left:  40px; }

        .divider {
            width: 3px; height: 80px;
            background: linear-gradient(to bottom,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.6) 50%,
                rgba(255,255,255,0) 100%);
            box-shadow: 0 0 4px rgba(255,255,255,0.3);
        }

        .main-text {
            font-weight: 900; font-size: 46px;
            letter-spacing: 0.5px; line-height: 1.1;
            text-transform: uppercase; white-space: nowrap;
        }

        /* Slow rainbow for rank label: red, orange, yellow, green, blue,
           indigo, violet and back to red, sweeping across the text. Each
           character runs the same colour loop a little further along than
           the one before it (see setRainbowText), so the colours slide
           across the word. It is done with text colour rather than a
           gradient clipped to the text because browsers' "dark mode for
           websites" darkens bright backgrounds, which turned the yellows
           brown. It leaves text alone when the colour is bright enough
           (0.299R + 0.587G + 0.114B of about 150 or more), so every stop
           here, and every blend between two of them, is at least that. */
        .unreal-rainbow { color: #ff6e5a; }
        .unreal-rainbow .rb { animation: rainbowSweep 45s linear infinite; }
        @keyframes rainbowSweep {
            0%      { color: #ff6e5a; }
            11.11%  { color: #ff8a1f; }
            22.22%  { color: #ffe31a; }
            33.33%  { color: #3ee06a; }
            44.44%  { color: #22d6f2; }
            55.56%  { color: #5aa5ff; }
            66.67%  { color: #9188ff; }
            77.78%  { color: #c070ff; }
            88.89%  { color: #ff70b0; }
            100%    { color: #ff6e5a; }
        }

        /* Shimmer for ELO number - thin purple line sweeps across white */
        .elo-container {
            position: relative; display: inline-block; color: #ffffff;
        }
        .elo-container::after {
            content: attr(data-text);
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg,
                transparent 40%,var(--accent) 47%,color-mix(in srgb, var(--accent) 80%, black) 50%,var(--accent) 53%,transparent 60%)
                no-repeat;
            background-size: 400% 100%; background-position: 100% 0%;
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 10s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%   { background-position: 100% 0%; }
            40%  { background-position: 0% 0%; }
            100% { background-position: 0% 0%; }
        }

        /* Shimmer for "X ELO UNTIL #xxx" - white base, very thin purple sweep */
        .next-shimmer {
            position: relative; display: inline-block; color: #ffffff;
        }
        .next-shimmer::after {
            content: attr(data-text);
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg,
                transparent 43%,var(--accent) 48%,color-mix(in srgb, var(--accent) 85%, white) 50%,var(--accent) 52%,transparent 57%)
                no-repeat;
            background-size: 500% 100%; background-position: 100% 0%;
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmerNext 14s ease-in-out infinite;
        }
        @keyframes shimmerNext {
            0%   { background-position: 100% 0%; }
            35%  { background-position: 0% 0%; }
            100% { background-position: 0% 0%; }
        }

        .sub-text {
            font-weight: 800; font-size: 26px;
            letter-spacing: 0.5px; margin-top: 4px;
            text-transform: uppercase; white-space: nowrap; text-align: center;
        }

        /* Left sub: ELO to next rank */
        .left-sub { color: var(--accent-light); }

        /* Next rank sub-parts */
        .next-gap-val { font-size: 26px; font-weight: 800; color: #ffffff;
                        letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap; }
        .next-to   { font-size: 18px; font-weight: 700; color: var(--accent-light);
                     letter-spacing: 0.5px; text-transform: uppercase; }
        .next-hash { font-size: 26px; font-weight: 800; color: var(--accent);
                     letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap; }

        /* Right sub: single ELO delta line - same font as .sub-text */
        .right-sub {
            display: flex; flex-direction: column;
            align-items: center; gap: 2px;
            margin-top: 4px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800; font-size: 26px;
            letter-spacing: 0.5px;
            text-transform: uppercase; white-space: nowrap;
        }

        /* Bottom centered code-ad row (spans full card width) */
        .bottom-row {
            width: 100%;
            margin-top: 16px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800; font-size: 28px;
            letter-spacing: 0.5px;
            text-transform: uppercase; white-space: nowrap;
        }
        .code-ad { color: #ffffff; font-style: italic; }

        .stats-row {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 34px;
            margin-top: 16px;
            min-height: 40px;
        }
        .stat { display: flex; flex-direction: row; align-items: baseline; gap: 8px; }
        .stat-label {
            font-size: 19px; font-weight: 700; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--stat-label-color);
        }
        .stat-label::after { content: ":"; }
        .stat-value { font-size: 30px; font-weight: 800; color: #ffffff; }

        .wl-wins   { color: #2ed573; text-shadow: 0 0 10px rgba(46,213,115,0.3); }
        .wl-sep    { color: #ffffff; margin: 0 2px; }
        .wl-losses { color: #ff4757; text-shadow: 0 0 10px rgba(255,71,87,0.3); }
        .row-divider { color: rgba(255,255,255,0.3); font-weight: 400; font-size: 14px; }

        .session-pos  { color: #2ed573; text-shadow: 0 0 10px rgba(46,213,115,0.2); }
        .session-neg  { color: #ff4757; text-shadow: 0 0 10px rgba(255,71,87,0.2); }
        .session-zero { color: #ffffff; }

        .wrap {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 0;
        }

        /* mode switcher - browser only, hidden by the OBS crop */
        .error-text {
            font-size: 11px;
            font-weight: 600;
            color: rgba(245, 166, 35, 0.9);
            text-align: center;
            line-height: 1.4;
            margin-top: 4px;
        }

        .mode-bar {
            display: flex;
            flex-direction: column;
            gap: 7px;
            width: 100%;
            margin-top: 50px;
        }

        .mode-btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(220, 220, 220, 0.55);
            background: rgba(20, 20, 20, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 13px 18px;
            cursor: pointer;
            user-select: none;
            width: 100%;
            text-align: center;
            transition: color 0.12s, background 0.12s, border-color 0.12s;
        }

        .mode-btn:hover {
            color: rgba(255, 255, 255, 0.90);
            background: rgba(40, 40, 40, 0.95);
            border-color: rgba(255, 255, 255, 0.20);
        }

        .mode-btn.active {
            color: #ffffff;
            background: rgba(55, 55, 55, 0.98);
            border-color: rgba(255, 255, 255, 0.30);
        }

        #codeInput.mode-btn {
            text-align: left;
            cursor: text;
        }

        #codeInput.mode-btn::placeholder {
            color: rgba(220, 220, 220, 0.35);
        }
        /* Set when OliTracker has no ELO for this account (see elo_unavailable). */
        .elo-na { display: none !important; }
    </style>
</head>
<body>
    <div class="wrap">

        <!-- overlay card: point your OBS browser source here -->
        <div class="overlay-container" style="flex-direction: column; align-items: stretch;">
            <div style="display:flex; align-items:center;">
                <div class="section left-section">
                    <div class="main-text unreal-rainbow" id="rankText">#- UNREAL</div>
                    <div class="sub-text left-sub">
                        <span id="nextContainer" style="display:inline-flex;align-items:center;gap:5px;">
                            <span class="next-gap-val" id="nextGap">-</span>
                            <span class="next-to">TO</span>
                            <span class="next-hash" id="nextPos">#-</span>
                        </span>
                    </div>
                </div>
                <div class="divider"></div>
                <div class="section right-section">
                    <div class="main-text elo-container" id="eloText" data-text="-- ELO">-- ELO</div>
                    <div class="right-sub">
                        <span class="session-zero" id="sessionText">+0 ELO TODAY</span>
                    </div>
                </div>
            </div>
            <div class="bottom-row" id="creatorRow">
                <span class="code-ad" id="creatorRowText"></span>
            </div>
            <div class="stats-row" id="statsRow">
                <div class="stat"><div class="stat-label">KD</div><div class="stat-value" id="seasonKd">-</div></div>
                <div class="stat"><div class="stat-label">WIN%</div><div class="stat-value" id="seasonWr">-</div></div>
                <div class="stat"><div class="stat-label">KILLS</div><div class="stat-value" id="seasonKills">-</div></div>
                <div class="stat"><div class="stat-label">WINS</div><div class="stat-value" id="seasonWins">-</div></div>
            </div>
        </div>

        <!-- mode switcher: open in your browser, OBS won't see this if cropped -->
        <div class="error-text" id="errorText" style="display:none"></div>
        <div class="mode-bar" id="modeBar"></div>
        <div class="mode-bar" id="displayToggleBar">
            <button class="mode-btn" id="statsToggleBtn">Stats</button>
            <button class="mode-btn" id="codeToggleBtn">Creator Code</button>
            <input class="mode-btn" id="codeInput" type="text" placeholder="Enter creator code" style="display:none;">
        </div>
    </div>

    <script src="../engine.js?v=481c442e99"></script>
    <script>if (!window.RankedEngine) { var n = 0; try { n = +sessionStorage.getItem('ro-reloads') || 0; sessionStorage.setItem('ro-reloads', n + 1); } catch (e) {} setTimeout(function () { location.reload(); }, Math.min(60000, 5000 * Math.pow(2, n))); } else { try { sessionStorage.removeItem('ro-reloads'); } catch (e) {} }</script>
    <script>window.RankedOverlay = RankedEngine.startOverlay(location.search);</script>
    <script>
        (function() {
            var c = new URLSearchParams(location.search).get('color');
            if (c) {
                c = c.replace('#', '');
                if (/^[0-9a-fA-F]{6}$/.test(c)) {
                    var r = parseInt(c.substr(0, 2), 16);
                    var g = parseInt(c.substr(2, 2), 16);
                    var b = parseInt(c.substr(4, 2), 16);
                    document.documentElement.style.setProperty('--accent', '#' + c);
                    document.documentElement.style.setProperty('--accent-rgb', r + ', ' + g + ', ' + b);
                    document.documentElement.style.setProperty('--stat-label-color', '#' + c);
                }
            }
        })();

        var POLL_MS      = RankedOverlay.config.refreshMs;
        var activeMode   = localStorage.getItem('fn_overlay_mode') || '';
        var modeBarBuilt = false;

        function $(s) { return document.querySelector(s); }

        // The rank text, one span per character, each starting the colour
        // loop RAINBOW_STEP seconds further along than the last, so the
        // rainbow sweeps across it. Rebuilt only when the text changes, and
        // offset by the clock so a new rank carries on the same sweep.
        var RAINBOW_CYCLE = 45, RAINBOW_STEP = 0.5;
        function setRainbowText(el, text) {
            if (el.getAttribute('data-text') === text) return;
            el.setAttribute('data-text', text);
            var phase = (performance.now() / 1000) % RAINBOW_CYCLE;
            el.textContent = '';
            for (var i = 0; i < text.length; i++) {
                var ch = document.createElement('span');
                ch.className = 'rb';
                ch.textContent = text.charAt(i);
                ch.style.animationDelay = -(phase + i * RAINBOW_STEP) + 's';
                el.appendChild(ch);
            }
        }
        setRainbowText($('#rankText'), $('#rankText').textContent);

        var INITIAL_CREATOR_CODE = RankedOverlay.config.creatorCode;
        // localStorage is shared by every overlay on localhost, so namespace the
        // keys per design and gate them on a signature of the server's config.
        // That way the wizard's choice (stats vs. code) and the configured code
        // always win on first load, and only an in-browser toggle for THIS
        // overlay persists, instead of one typed code bleeding across overlays.
        var FN_NS  = "Rainbow";
        var K_MODE = 'fn_display_mode_' + FN_NS;
        var K_CODE = 'fn_creator_code_' + FN_NS;
        var K_SIG  = 'fn_config_sig_' + FN_NS;

        var displayMode, creatorCode;
        if (localStorage.getItem(K_SIG) === INITIAL_CREATOR_CODE) {
            displayMode = localStorage.getItem(K_MODE) || (INITIAL_CREATOR_CODE ? 'code' : 'stats');
            var _savedCode = localStorage.getItem(K_CODE);
            creatorCode = (_savedCode === null) ? INITIAL_CREATOR_CODE : _savedCode;
        } else {
            displayMode = INITIAL_CREATOR_CODE ? 'code' : 'stats';
            creatorCode = INITIAL_CREATOR_CODE;
            localStorage.setItem(K_SIG, INITIAL_CREATOR_CODE);
            localStorage.setItem(K_MODE, displayMode);
            localStorage.setItem(K_CODE, creatorCode);
        }

        function renderCreatorText() {
            var el = $('#creatorRowText') || $('#creatorRow');
            el.textContent = creatorCode ? ('Use Code ' + creatorCode + ' #ad') : '';
        }

        function applyDisplayMode() {
            var statsEl = $('#statsRow');
            var codeEl  = $('#creatorRow');
            var input   = $('#codeInput');
            if (displayMode === 'code') {
                statsEl.style.display = 'none';
                codeEl.style.display  = '';
                input.style.display   = '';
            } else {
                statsEl.style.display = '';
                codeEl.style.display  = 'none';
                input.style.display   = 'none';
            }
            $('#statsToggleBtn').classList.toggle('active', displayMode === 'stats');
            $('#codeToggleBtn').classList.toggle('active', displayMode === 'code');
        }

        $('#statsToggleBtn').addEventListener('click', function() {
            displayMode = 'stats';
            localStorage.setItem(K_MODE, displayMode);
            applyDisplayMode();
        });
        $('#codeToggleBtn').addEventListener('click', function() {
            displayMode = 'code';
            localStorage.setItem(K_MODE, displayMode);
            applyDisplayMode();
        });
        $('#codeInput').addEventListener('input', function(e) {
            creatorCode = e.target.value;
            localStorage.setItem(K_CODE, creatorCode);
            renderCreatorText();
        });
        $('#codeInput').value = creatorCode || '';
        renderCreatorText();
        applyDisplayMode();

        function buildModeBar(modes) {
            if (modeBarBuilt) return;
            modeBarBuilt = true;
            var bar = $('#modeBar');
            bar.innerHTML = '';
            modes.forEach(function(m) {
                var btn = document.createElement('button');
                btn.className   = 'mode-btn';
                btn.textContent = m.label;
                btn.dataset.key = m.key;
                btn.addEventListener('click', function() {
                    if (activeMode === m.key) return;
                    activeMode = m.key;
                    localStorage.setItem('fn_overlay_mode', activeMode);
                    document.querySelectorAll('.mode-btn').forEach(function(b) {
                        b.classList.toggle('active', b.dataset.key === activeMode);
                    });
                    tick();
                });
                bar.appendChild(btn);
            });
        }

        // ---- fetch data and update overlay ----
        function tick() {
            var url = '/data?window=session' + (activeMode ? '&mode=' + encodeURIComponent(activeMode) : '');
            RankedOverlay.fetchData(url)
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    if (!d) return;

                    var errEl = $('#errorText');
                    if (errEl) {
                        if (d.error) {
                            errEl.textContent = d.error;
                            errEl.style.display = 'block';
                        } else {
                            errEl.style.display = 'none';
                        }
                    }

                    if (d.ok === false && !d.elo_text) return;

                    setRainbowText($('#rankText'), d.rank_display || '#- UNREAL');

                    var eloEl  = $('#eloText');
                    // Below Unreal there is no ELO, so this slot carries the
                    // promotion progress instead of an empty placeholder.
                    var eloStr = d.elo_text
                        || ((d.progression_pct !== null && d.progression_pct !== undefined)
                                ? d.progression_pct + '%'
                                : '-- ELO');
                    eloEl.textContent = eloStr;
                    eloEl.setAttribute('data-text', eloStr);

                    // ELO to next rank (Unreal) or percent to next rank (everyone else)
                    var gapEl  = $('#nextGap');
                    var posEl  = $('#nextPos');
                    var gapStr, posStr;
                    if (d.is_unreal) {
                        gapStr = d.next_gap ? d.next_gap + ' ELO' : '-';
                        posStr = d.next_pos ? '#' + d.next_pos : '#-';
                    } else {
                        gapStr = d.next_gap || '-';
                        posStr = d.next_pos || '-';
                    }
                    gapEl.textContent = gapStr;
                    posEl.textContent = posStr;

                    var sessEl = $('#sessionText');
                    sessEl.textContent = d.session_text || '+0 ELO TODAY';
                    sessEl.className   = 'session-' + (d.session_sign || 'zero');

                    if ($('#seasonKd')) {
                        $('#seasonKd').textContent    = d.season_kd    != null ? d.season_kd    : '-';
                        $('#seasonWr').textContent    = d.season_wr    != null ? d.season_wr    : '-';
                        $('#seasonKills').textContent = d.season_kills != null ? d.season_kills : '-';
                        $('#seasonWins').textContent  = d.season_wins  != null ? d.season_wins  : '-';
                    }

                    // OliTracker only publishes ELO for the ranks it tracks. Below that
            // there is no ELO and no leaderboard row to measure a gap against,
            // so hide those widgets rather than render empty placeholders.
            var _eloNA = !!d.elo_unavailable;
            ['.right-section', '.divider', '#nextContainer'].forEach(function(sel) {
                var el = document.querySelector(sel);
                if (el) el.classList.toggle('elo-na', _eloNA);
            });
            // No ELO means no gap either, so the gap row goes with it.
            var _gapNA = _eloNA || !!d.gap_unavailable;
            ['#nextContainer'].forEach(function(sel) {
                document.querySelectorAll(sel).forEach(function(el) {
                    el.classList.toggle('elo-na', _gapNA);
                });
            });

            var modes = d.modes_available;
                    if (modes && modes.length > 0) {
                        if (!activeMode) {
                            activeMode = d.active_mode_key || modes[0].key;
                        }
                        buildModeBar(modes);
                        document.querySelectorAll('.mode-btn').forEach(function(b) {
                            b.classList.toggle('active', b.dataset.key === activeMode);
                        });
                    }
                })
                .catch(function() { /* keep last values on a network blip */ });
        }

        // ---- init ----
        tick();
        RankedOverlay.onUpdate(tick);
    </script>
</body>
</html>
