<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Generated by tools/build.py from src/designs/Simple.html. Edit that file, not this one. -->
    <meta name="robots" content="noindex">
    <meta name="darkreader-lock">
    <meta name="obs-height" content="245">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite Rank Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --accent: #3d8bff;
            --accent-rgb: 61, 139, 255;
            --accent-light: color-mix(in srgb, var(--accent) 60%, white);
            /* Card look, set from the link (see the top of the script). */
            --radius: 20px;
            --bg-alpha: 0.84;
            /* Unreal Legend: the colours of its icon, cyan through purple to red-orange. */
            --legend: linear-gradient(135deg, #63e6ff 0%, #6d8dff 28%, #b35cff 52%, #ff4f7a 76%, #ffad6b 100%);
        }

        body {
            background: transparent;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            height: 100vh;
            padding: 16px;
        }

        .wrap {
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        /* The card: the rank icon on the left, everything else beside it. */
        .overlay-container {
            display: flex;
            align-items: center;
            gap: 18px;
            background: rgba(14, 16, 22, var(--bg-alpha));
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, calc(var(--bg-alpha) * 0.08));
            border-radius: var(--radius);
            padding: 16px 24px 16px 16px;
            min-width: 470px;
            user-select: none;
        }

        .rank-icon {
            width: 88px;
            height: 88px;
            flex: 0 0 auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
        }
        .rank-icon.hidden { visibility: hidden; }
        html.legend .rank-icon {
            filter: drop-shadow(0 0 10px rgba(179, 92, 255, 0.55)) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
        }

        .info {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-width: 0;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 28px;
        }

        .rank-text {
            font-weight: 800;
            font-size: 34px;
            line-height: 1.1;
            letter-spacing: -0.02em;
            color: #ffffff;
            white-space: nowrap;
        }
        .rank-text .place {
            color: var(--accent-light);
            margin-left: 8px;
        }
        html.legend .rank-text .place { color: inherit; }
        html.legend .rank-text,
        html.legend .elo-text {
            display: inline-block;
            /* Room for the g's tail and the last letter's edge, which
               background-clip would otherwise cut off. */
            padding: 0 0.08em 0.14em 0;
            margin: 0 -0.08em -0.14em 0;
            background: var(--legend);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .today {
            font-weight: 700;
            font-size: 22px;
            white-space: nowrap;
            color: rgba(255, 255, 255, 0.55);
        }
        .session-pos  { color: #34d27b; }
        .session-neg  { color: #ff5a67; }
        .session-zero { color: #ffffff; }

        /* Below Unreal: how far into the rank, and what's left to the next. */
        .bar {
            height: 10px;
            margin-top: 12px;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.12);
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0;
            border-radius: 99px;
            background: var(--accent);
            transition: width 0.4s ease;
        }
        .bar-note {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 6px;
            align-items: baseline;
            font-weight: 600;
            font-size: 18px;
            white-space: nowrap;
            color: rgba(255, 255, 255, 0.60);
        }
        .bar-note b { color: #ffffff; font-weight: 700; }
        .bar-note .have { color: var(--accent-light); font-weight: 800; font-size: 20px; }

        /* Unreal: the ELO, and the gap to the next spot. */
        .elo-row {
            display: none;
            justify-content: space-between;
            align-items: baseline;
            gap: 28px;
            margin-top: 6px;
            white-space: nowrap;
        }
        .elo-text {
            font-weight: 800;
            font-size: 29px;
            letter-spacing: -0.01em;
            color: var(--accent-light);
        }
        .gap-text {
            font-weight: 600;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.60);
        }
        .gap-text b { color: #ffffff; font-weight: 700; }

        html.unreal .bar,
        html.unreal .bar-note { display: none; }
        html.unreal .elo-row { display: flex; }

        .season-row {
            display: flex;
            gap: 20px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-weight: 600;
            font-size: 16px;
            white-space: nowrap;
            color: rgba(255, 255, 255, 0.55);
        }
        .stat-item span { font-weight: 700; color: rgba(255, 255, 255, 0.92); }

        .creator-row {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-weight: 700;
            font-size: 17px;
            letter-spacing: 0.03em;
            white-space: nowrap;
            color: var(--accent-light);
        }
        .creator-row:empty { display: none !important; }

        /* Optional "3 WINS, 1 LOSS" line (?rec=1 in the link). */
        .rec-line {
            display: none;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            white-space: nowrap;
            width: 0;
            min-width: 100%;
            overflow: hidden;
        }
        .rec-line .rw { color: #4ade80; }
        .rec-line .rl { color: #f87171; }
        .rec-line .rs { color: rgba(255, 255, 255, 0.45); }

        .error-text {
            font-size: 11px;
            font-weight: 600;
            color: rgba(245, 166, 35, 0.9);
            text-align: center;
            line-height: 1.4;
            margin-top: 4px;
        }

        .mode-bar {
            display: flex;
            flex-direction: column;
            gap: 7px;
            width: 100%;
            margin-top: 50px;
        }

        .mode-btn {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(220, 220, 220, 0.55);
            background: rgba(20, 20, 20, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 13px 18px;
            cursor: pointer;
            user-select: none;
            width: 100%;
            text-align: center;
            transition: color 0.12s, background 0.12s, border-color 0.12s;
        }

        .mode-btn:hover {
            color: rgba(255, 255, 255, 0.90);
            background: rgba(40, 40, 40, 0.95);
            border-color: rgba(255, 255, 255, 0.20);
        }

        .mode-btn.active {
            color: #ffffff;
            background: rgba(55, 55, 55, 0.98);
            border-color: rgba(255, 255, 255, 0.30);
        }

        #codeInput.mode-btn { text-align: left; cursor: text; }
        #codeInput.mode-btn::placeholder { color: rgba(220, 220, 220, 0.35); }

        /* Set when OliTracker has no ELO for this account (see elo_unavailable). */
        .elo-na { display: none !important; }

        /* ?outline=1: a ring in the rank's colour. */
        html.outline .overlay-container { border: 2px solid rgba(var(--accent-rgb), 0.9); }
        /* ?icon=0: no rank icon. */
        html.no-icon .rank-icon { display: none !important; }
        html.no-icon .overlay-container { padding-left: 24px; }
        /* A see-through card: a shadow under the text keeps it readable on gameplay. */
        html.clear .overlay-container { backdrop-filter: none; }
        html.clear .info { text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85), 0 0 2px rgba(0, 0, 0, 0.9); }
        html.clear .bar { background: rgba(0, 0, 0, 0.45); }
        /* Gradient text is see-through itself, so a text-shadow would show
           through it: shadow the shape instead. */
        html.clear.legend .rank-text,
        html.clear.legend .elo-text {
            text-shadow: none;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.85));
        }

        /* Nothing below the rank (?show=none): no stats, no creator code. */
        html.bare #statsRow,
        html.bare #creatorRow { display: none !important; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="overlay-container">
            <img class="rank-icon hidden" id="rankIcon" alt="">
            <div class="info">
                <div class="top-row">
                    <div class="rank-text" id="rankText">-</div>
                    <div class="today" id="todayBox">Today: <span class="session-zero" id="sessionText">+0%</span></div>
                </div>

                <div class="bar" id="bar"><div class="bar-fill" id="barFill"></div></div>
                <div class="bar-note" id="barNote"></div>

                <div class="elo-row" id="eloRow">
                    <div class="elo-text" id="eloText">-- ELO</div>
                    <div class="gap-text" id="gapText"></div>
                </div>

                <div class="season-row" id="statsRow">
                    <div class="stat-item">KD <span id="seasonKd">-</span></div>
                    <div class="stat-item">WR <span id="seasonWr">-%</span></div>
                    <div class="stat-item">Kills <span id="seasonKills">-</span></div>
                    <div class="stat-item">Wins <span id="seasonWins">-</span></div>
                </div>
                <div class="creator-row" id="creatorRow"></div>
                <div class="rec-line" id="recLine"></div>
            </div>
        </div>

        <div class="error-text" id="errorText" style="display:none"></div>
        <div class="mode-bar" id="modeBar"></div>
        <div class="mode-bar" id="displayToggleBar">
            <button class="mode-btn" id="statsToggleBtn">Stats</button>
            <button class="mode-btn" id="codeToggleBtn">Creator Code</button>
            <input class="mode-btn" id="codeInput" type="text" size="1" placeholder="Enter creator code" style="display:none;">
        </div>
    </div>

    <script src="../engine.js?v=eefe2d9b41"></script>
    <script>if (!window.RankedEngine) { var n = 0; try { n = +sessionStorage.getItem('ro-reloads') || 0; sessionStorage.setItem('ro-reloads', n + 1); } catch (e) {} setTimeout(function () { location.reload(); }, Math.min(60000, 5000 * Math.pow(2, n))); } else { try { sessionStorage.removeItem('ro-reloads'); } catch (e) {} }</script>
    <script>window.RankedOverlay = RankedEngine.startOverlay(location.search);</script>
    <script>
        (function() {
            var c = new URLSearchParams(location.search).get('color');
            if (c) {
                c = c.replace('#', '');
                if (/^[0-9a-fA-F]{6}$/.test(c)) {
                    var r = parseInt(c.substr(0, 2), 16);
                    var g = parseInt(c.substr(2, 2), 16);
                    var b = parseInt(c.substr(4, 2), 16);
                    document.documentElement.style.setProperty('--accent', '#' + c);
                    document.documentElement.style.setProperty('--accent-rgb', r + ', ' + g + ', ' + b);
                    window.ACCENT_FROM_LINK = true;
                }
            }

            // Card look: round= corner rounding and bg= background opacity,
            // both 0 to 100; icon=0 hides the rank icon; outline=1 adds a ring.
            var q = new URLSearchParams(location.search), root = document.documentElement;
            function pct(name) {
                var v = parseInt(q.get(name), 10);
                return isFinite(v) ? Math.max(0, Math.min(100, v)) : null;
            }
            var round = pct('round'), bg = pct('bg');
            if (round !== null) root.style.setProperty('--radius', (round * 0.4) + 'px');
            if (bg !== null) {
                root.style.setProperty('--bg-alpha', String(bg / 100));
                root.classList.toggle('clear', bg < 40);
            }
            if (q.get('icon') === '0') root.classList.add('no-icon');
            if (q.get('outline') === '1') root.classList.add('outline');
        })();

        var POLL_MS      = RankedOverlay.config.refreshMs;
        var activeMode   = localStorage.getItem('fn_overlay_mode') || '';
        var modeBarBuilt = false;

        function $(s) { return document.querySelector(s); }

        // "3 WINS, 1 LOSS" under the card when the link has ?rec=1.
        var SHOW_REC = new URLSearchParams(location.search).get('rec') === '1';
        function renderRecordLine(d) {
            var el = $('#recLine');
            if (!el) return;
            if (!SHOW_REC || d.record_wins === undefined || d.record_wins === null) {
                el.style.display = 'none';
                return;
            }
            var w = Number(d.record_wins) || 0, l = Number(d.record_losses) || 0;
            el.innerHTML = '<span class="rec-in"><span class="rw">' + w + ' ' + (w === 1 ? 'WIN' : 'WINS') + '</span>'
                + '<span class="rs">,</span> '
                + '<span class="rl">' + l + ' ' + (l === 1 ? 'LOSS' : 'LOSSES') + '</span></span>';
            el.style.display = 'block';
            // A long record shrinks to fit instead of widening the card.
            el.style.fontSize = '';
            var fs = 16, inner = el.firstChild;
            while (fs > 11 && inner.offsetWidth > el.clientWidth) { fs -= 1; el.style.fontSize = fs + 'px'; }
        }

        var INITIAL_CREATOR_CODE = RankedOverlay.config.creatorCode;
        // Per-design keys, so a code typed here doesn't bleed into other overlays.
        var FN_NS  = "Simple";
        var K_MODE = 'fn_display_mode_' + FN_NS;
        var K_CODE = 'fn_creator_code_' + FN_NS;
        var K_SIG  = 'fn_config_sig_' + FN_NS;

        var displayMode, creatorCode;
        if (localStorage.getItem(K_SIG) === INITIAL_CREATOR_CODE) {
            displayMode = localStorage.getItem(K_MODE) || (INITIAL_CREATOR_CODE ? 'code' : 'stats');
            var _savedCode = localStorage.getItem(K_CODE);
            creatorCode = (_savedCode === null) ? INITIAL_CREATOR_CODE : _savedCode;
        } else {
            displayMode = INITIAL_CREATOR_CODE ? 'code' : 'stats';
            creatorCode = INITIAL_CREATOR_CODE;
            localStorage.setItem(K_SIG, INITIAL_CREATOR_CODE);
            localStorage.setItem(K_MODE, displayMode);
            localStorage.setItem(K_CODE, creatorCode);
        }

        function renderCreatorText() {
            $('#creatorRow').textContent = creatorCode ? ('Use Code ' + creatorCode + ' #ad') : '';
        }

        function applyDisplayMode() {
            var statsEl = $('#statsRow');
            var codeEl  = $('#creatorRow');
            var input   = $('#codeInput');
            if (displayMode === 'code') {
                statsEl.style.display = 'none';
                codeEl.style.display  = '';
                input.style.display   = '';
            } else {
                statsEl.style.display = '';
                codeEl.style.display  = 'none';
                input.style.display   = 'none';
            }
            $('#statsToggleBtn').classList.toggle('active', displayMode === 'stats');
            $('#codeToggleBtn').classList.toggle('active', displayMode === 'code');
        }

        $('#statsToggleBtn').addEventListener('click', function() {
            displayMode = 'stats';
            localStorage.setItem(K_MODE, displayMode);
            applyDisplayMode();
        });
        $('#codeToggleBtn').addEventListener('click', function() {
            displayMode = 'code';
            localStorage.setItem(K_MODE, displayMode);
            applyDisplayMode();
        });
        $('#codeInput').addEventListener('input', function(e) {
            creatorCode = e.target.value;
            localStorage.setItem(K_CODE, creatorCode);
            renderCreatorText();
        });
        $('#codeInput').value = creatorCode || '';
        renderCreatorText();
        applyDisplayMode();

        // Fortnite's rank icons, 0 (Bronze I) to 21 (Unreal) and legend, in ../ranks/.
        var RANK_ORDER = ['BRONZE I', 'BRONZE II', 'BRONZE III', 'SILVER I', 'SILVER II', 'SILVER III',
            'GOLD I', 'GOLD II', 'GOLD III', 'PLATINUM I', 'PLATINUM II', 'PLATINUM III',
            'DIAMOND I', 'DIAMOND II', 'DIAMOND III', 'ELITE I', 'ELITE II', 'ELITE III',
            'CHAMPION I', 'CHAMPION II', 'CHAMPION III', 'UNREAL'];
        // The top 500 Unreal players get called Unreal Legend.
        var LEGEND_TOP = 500;
        // Without a colour in the link, the card takes the rank's own colour.
        var TIER_COLORS = { BRONZE: '#d08a4e', SILVER: '#9fb0d0', GOLD: '#f2b320', PLATINUM: '#2fc9c4',
            DIAMOND: '#4c7dff', ELITE: '#d94fe0', CHAMPION: '#ff4a2a', UNREAL: '#9b5cff' };
        function setTierColor(label) {
            if (window.ACCENT_FROM_LINK) return;
            var c = TIER_COLORS[String(label).split(' ')[0]];
            if (!c) return;
            var root = document.documentElement.style;
            root.setProperty('--accent', c);
            root.setProperty('--accent-rgb', parseInt(c.substr(1, 2), 16) + ', ' + parseInt(c.substr(3, 2), 16) + ', ' + parseInt(c.substr(5, 2), 16));
        }
        var ROMAN = {'I':true,'II':true,'III':true,'IV':true,'V':true,'VI':true};

        function esc(s) {
            return String(s).replace(/[&<>"]/g, function(ch) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
            });
        }

        // "DIAMOND II" -> "Diamond II".
        function titleCase(text) {
            return String(text || '').split(' ').map(function(w) {
                if (ROMAN[w]) return w;
                return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
            }).join(' ');
        }

        // "1542 ELO" -> "1,542 ELO".
        function commas(text) {
            return String(text).replace(/\d{4,}/g, function(n) { return Number(n).toLocaleString('en-US'); });
        }

        // "+16% TODAY" -> ["Today", "+16%"]; "+23 ELO 24H" -> ["24h", "+23 ELO"].
        function splitSession(text) {
            var m = String(text || '').match(/^([+-]?[\d,]+(?:%| ELO| SPOTS?)?)\s*(.*)$/i);
            if (!m) return ['Today', String(text || '')];
            var value = m[1].replace(/ SPOTS?$/i, function(u) { return u.toLowerCase(); });
            var label = m[2].trim();
            if (!label || /^today$/i.test(label)) label = 'Today';
            else if (/^\d+H$/i.test(label)) label = label.toLowerCase();
            else label = titleCase(label);
            return [label, value];
        }

        function buildModeBar(modes) {
            if (modeBarBuilt) return;
            modeBarBuilt = true;
            var bar = $('#modeBar');
            bar.innerHTML = '';
            modes.forEach(function(m) {
                var btn = document.createElement('button');
                btn.className   = 'mode-btn';
                btn.textContent = m.label;
                btn.dataset.key = m.key;
                btn.addEventListener('click', function() {
                    if (activeMode === m.key) return;
                    activeMode = m.key;
                    localStorage.setItem('fn_overlay_mode', activeMode);
                    document.querySelectorAll('#modeBar .mode-btn').forEach(function(b) {
                        b.classList.toggle('active', b.dataset.key === activeMode);
                    });
                    tick();
                });
                bar.appendChild(btn);
            });
        }

        function applyData(d) {
            if (!d || !d.rank_display) return;

            renderRecordLine(d);

            var errEl = $('#errorText');
            if (errEl) {
                if (d.error) {
                    errEl.textContent = d.error;
                    errEl.style.display = 'block';
                } else {
                    errEl.style.display = 'none';
                }
            }

            var root   = document.documentElement;
            var rankEl = $('#rankText');
            var iconEl = $('#rankIcon');
            var label  = String(d.rank_label || '').toUpperCase();
            var place  = Number(d.rank_number) || 0;
            var legend = !!d.is_unreal && place > 0 && place <= LEGEND_TOP;

            root.classList.toggle('unreal', !!d.is_unreal);
            root.classList.toggle('legend', legend);

            var idx = d.is_unreal ? 21 : RANK_ORDER.indexOf(label);
            if (idx >= 0) setTierColor(RANK_ORDER[idx]);
            if (idx >= 0) {
                var src = '../ranks/' + (legend ? 'legend' : idx) + '.png';
                if (iconEl.getAttribute('src') !== src) iconEl.setAttribute('src', src);
                iconEl.classList.remove('hidden');
                iconEl.style.display = '';
            } else {
                // No rank to show (a private profile, say): just the message.
                iconEl.style.display = 'none';
            }

            if (d.is_unreal) {
                rankEl.innerHTML = '<span class="name">' + (legend ? 'Unreal Legend' : 'Unreal') + '</span>'
                    + (place ? '<span class="place">#' + place + '</span>' : '');
            } else if (idx >= 0) {
                rankEl.innerHTML = '<span class="name">' + esc(titleCase(label)) + '</span>';
            } else {
                rankEl.textContent = d.rank_display;
            }

            // Below Unreal: the bar fills with how far into the rank they are.
            var prog = d.progression_pct;
            var hasProg = !d.is_unreal && prog !== null && prog !== undefined;
            $('#bar').style.display = hasProg ? '' : 'none';
            $('#barFill').style.width = hasProg ? Math.max(0, Math.min(100, Number(prog))) + '%' : '0';
            var note = $('#barNote');
            if (hasProg && d.pct_to_next !== null && d.pct_to_next !== undefined) {
                note.innerHTML = '<span class="have">' + Math.round(Number(prog)) + '%</span>'
                    + '<span><b>' + d.pct_to_next + '%</b> to ' + esc(d.next_rank_name ? titleCase(d.next_rank_name) : 'next rank') + '</span>';
                note.style.display = '';
            } else {
                note.style.display = 'none';
            }

            // Unreal: the ELO, and how much more for the next spot up.
            $('#eloText').textContent = d.elo_text ? commas(d.elo_text) : '-- ELO';
            var gapEl = $('#gapText');
            if (d.is_unreal && d.next_gap && d.next_pos) {
                gapEl.innerHTML = '<b>' + esc(d.next_gap) + esc(d.next_unit || ' ELO') + '</b> to <b>#' + esc(d.next_pos) + '</b>';
            } else {
                gapEl.innerHTML = '';
            }

            var sp = splitSession(d.session_text || (d.is_unreal ? '+0 ELO TODAY' : '+0% TODAY'));
            $('#todayBox').firstChild.nodeValue = sp[0] + ': ';
            var sessEl = $('#sessionText');
            sessEl.textContent = sp[1];
            sessEl.className   = 'session-' + (d.session_sign || 'zero');

            $('#seasonKd').textContent    = d.season_kd    != null ? d.season_kd    : '-';
            $('#seasonWr').textContent    = d.season_wr    != null ? d.season_wr    : '-';
            $('#seasonKills').textContent = d.season_kills != null ? d.season_kills : '-';
            $('#seasonWins').textContent  = d.season_wins  != null ? d.season_wins  : '-';

            // OliTracker only publishes ELO for the ranks it tracks. Without it
            // the ELO number goes; the change slot shows the placement change
            // (spots_text) when there is one, or goes too.
            var _eloNA = !!d.elo_unavailable;
            var _spots = _eloNA && !!d.spots_text;
            ['#eloText'].forEach(function(sel) {
                document.querySelectorAll(sel).forEach(function(el) { el.classList.toggle('elo-na', _eloNA); });
            });
            ['#todayBox'].forEach(function(sel) {
                document.querySelectorAll(sel).forEach(function(el) { el.classList.toggle('elo-na', _eloNA && !_spots); });
            });
            var _gapNA = !!d.gap_unavailable || (_eloNA && !_spots);
            ['#gapText'].forEach(function(sel) {
                document.querySelectorAll(sel).forEach(function(el) { el.classList.toggle('elo-na', _gapNA); });
            });
            // Neither the ELO nor the gap: no empty row left behind.
            $('#eloRow').classList.toggle('elo-na', _eloNA && (_gapNA || !gapEl.innerHTML));

            var modes = d.modes_available;
            if (modes && modes.length > 0) {
                if (!activeMode) activeMode = d.active_mode_key || modes[0].key;
                buildModeBar(modes);
                document.querySelectorAll('#modeBar .mode-btn').forEach(function(b) {
                    b.classList.toggle('active', b.dataset.key === activeMode);
                });
            }
        }

        function tick() {
            var url = '/data?window=session' + (activeMode ? '&mode=' + encodeURIComponent(activeMode) : '');
            RankedOverlay.fetchData(url)
                .then(function(r) { return r.json(); })
                .then(applyData)
                .catch(function() {});
        }

        tick();
        RankedOverlay.onUpdate(tick);
    </script>
</body>
</html>
