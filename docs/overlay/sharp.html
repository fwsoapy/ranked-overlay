<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Generated by tools/build.py from src/designs/Sharp.html. Edit that file, not this one. -->
    <meta name="robots" content="noindex">
    <meta name="darkreader-lock">
    <meta name="obs-height" content="265">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite Rank Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Bebas+Neue&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --accent: #cc1111;
            --accent-rgb: 204, 17, 17;
            --accent-light: color-mix(in srgb, var(--accent) 65%, white);
        }

        body {
            background: transparent;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .overlay-container {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 0;
            user-select: none;
            min-width: 480px;
        }

        .card {
            position: relative;
            background: rgba(8, 4, 4, 0.93);
            border-left: 4px solid var(--accent);
            padding: 22px 32px 22px 26px;
            clip-path: polygon(0 0, 100% 0, 97% 100%, 0 100%);
        }

        .rank-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            line-height: 1;
        }

        .rank-label {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 80px;
            color: #fff;
            letter-spacing: 3px;
            white-space: nowrap;
        }

        .unreal-rainbow {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 80px;
            letter-spacing: 3px;
            white-space: nowrap;
            color: var(--accent);
        }

        .stat-row {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-top: 2px;
        }

        .elo-val {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 44px;
            color: var(--accent);
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .sep {
            width: 2px;
            height: 32px;
            background: rgba(var(--accent-rgb), 0.5);
        }

        .session-delta {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 28px;
            letter-spacing: 1px;
            white-space: nowrap;
            text-transform: uppercase;
        }
        .session-pos  { color: #33ff88; }
        .session-neg  { color: #ff3333; }
        .session-zero { color: #ffffff; }

        .next-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-top: 10px;
        }
        .next-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* shared slot so stats and creator code occupy the same height */
        .bottom-slot {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            height: 48px;
        }

        .next-gap-val {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 22px;
            color: var(--accent-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .next-to {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .next-hash {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .prog-wrap {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .prog-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .prog-pct-text {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 44px;
            color: var(--accent);
            letter-spacing: 2px;
        }
        .prog-bar-track {
            width: 100%;
            height: 5px;
            background: rgba(var(--accent-rgb), 0.15);
            border-radius: 2px;
            overflow: hidden;
        }
        .prog-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        .ad-tag {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 26px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #ffffff;
            white-space: nowrap;
        }

        .stats-row {
            display: flex;
            gap: 22px;
        }
        .stat-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent-light);
        }
        .stat-value {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            color: #ffffff;
            letter-spacing: 1px;
        }

        /* Optional "3 WINS, 1 LOSS" footer (?rec=1 in the link). Hidden unless asked for.
           A strip with a thin divider on top that runs down to the card's bottom edge,
           with the text centered in it, so it sits evenly between the two. */
        .rec-line {
            display: none;
            align-items: center;
            justify-content: center;
            height: 50px;
            width: 0;
            min-width: 100%;
            box-sizing: border-box;
            overflow: hidden;
            margin-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
            text-align: center;
        }
        .rec-line .rw { color: #4ade80; }
        .rec-line .rl { color: #f87171; }
        .rec-line .rs { color: rgba(255, 255, 255, 0.45); }
        .rec-line { margin-bottom: -22px; }

        .error-text {
            font-size: 11px;
            font-weight: 600;
            color: rgba(245, 166, 35, 0.9);
            text-align: center;
            line-height: 1.4;
            margin-top: 4px;
        }

        .mode-bar {
            display: flex;
            flex-direction: column;
            gap: 7px;
            width: 100%;
            margin-top: 50px;
        }

        .mode-btn {
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(220, 220, 220, 0.55);
            background: rgba(20, 20, 20, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 13px 18px;
            cursor: pointer;
            user-select: none;
            width: 100%;
            text-align: center;
            transition: color 0.12s, background 0.12s, border-color 0.12s;
        }

        .mode-btn:hover {
            color: rgba(255, 255, 255, 0.90);
            background: rgba(40, 40, 40, 0.95);
            border-color: rgba(255, 255, 255, 0.20);
        }

        .mode-btn.active {
            color: #ffffff;
            background: rgba(55, 55, 55, 0.98);
            border-color: rgba(255, 255, 255, 0.30);
        }

        #codeInput.mode-btn {
            text-align: left;
            cursor: text;
        }

        #codeInput.mode-btn::placeholder {
            color: rgba(220, 220, 220, 0.35);
        }
        /* Set when OliTracker has no ELO for this account (see elo_unavailable). */
        .elo-na { display: none !important; }
    
        /* Compact overlay (?compact=1): only the important rows. */
        html.compact #statsRow,
        html.compact #creatorRow,
        html.compact #creatorRowText { display: none !important; }
        html.compact .bottom-slot { display: none; }
    </style>
</head>
<body>
    <div class="overlay-container">

        <!-- MAIN CARD -->
        <div class="card">

            <!-- Rank -->
            <div class="rank-row">
                <div class="rank-label unreal-rainbow" id="rankText">#- UNREAL</div>
            </div>

            <!-- ELO + session delta -->
            <div class="stat-row" id="rightSection">
                <div class="elo-val" id="eloText">-- ELO</div>
                <div class="sep"></div>
                <span class="session-delta session-zero" id="sessionText">+0 TODAY</span>
            </div>

            <!-- non-unreal progress -->
            <div class="prog-wrap" id="progSection" style="display:none;">
                <div class="prog-header">
                    <div class="prog-pct-text" id="progPct">0%</div>
                    <span class="session-delta session-zero" id="sessionText2">+0% TODAY</span>
                </div>
                <div class="prog-bar-track">
                    <div class="prog-bar-fill" id="progFill" style="width:0%"></div>
                </div>
            </div>

            <!-- next leaderboard position + stats/creator code (same slot, right side) -->
            <div class="next-row" id="leftSubRow">
                <div class="next-left" id="nextLeft">
                    <span class="next-gap-val" id="nextGap">-</span>
                    <span class="next-to" id="nextToLabel">TO</span>
                    <span class="next-hash" id="nextPos">#-</span>
                </div>
                <div class="bottom-slot">
                    <div class="stats-row" id="statsRow">
                        <div><div class="stat-label">KD</div><div class="stat-value" id="seasonKd">-</div></div>
                        <div><div class="stat-label">WIN%</div><div class="stat-value" id="seasonWr">-</div></div>
                        <div><div class="stat-label">KILLS</div><div class="stat-value" id="seasonKills">-</div></div>
                        <div><div class="stat-label">WINS</div><div class="stat-value" id="seasonWins">-</div></div>
                    </div>
                    <span class="ad-tag" id="creatorRow"></span>
                </div>
            </div>
            <div class="rec-line" id="recLine"></div>
        </div>

        <!-- MODE BUTTONS -->
        <div class="error-text" id="errorText" style="display:none"></div>
        <div class="mode-bar" id="modeBar"></div>
        <div class="mode-bar" id="displayToggleBar">
            <button class="mode-btn" id="statsToggleBtn">Stats</button>
            <button class="mode-btn" id="codeToggleBtn">Creator Code</button>
            <input class="mode-btn" id="codeInput" type="text" size="1" placeholder="Enter creator code" style="display:none;">
        </div>

    </div>

    <script src="../engine.js?v=bb653585e2"></script>
    <script>if (!window.RankedEngine) { var n = 0; try { n = +sessionStorage.getItem('ro-reloads') || 0; sessionStorage.setItem('ro-reloads', n + 1); } catch (e) {} setTimeout(function () { location.reload(); }, Math.min(60000, 5000 * Math.pow(2, n))); } else { try { sessionStorage.removeItem('ro-reloads'); } catch (e) {} }</script>
    <script>window.RankedOverlay = RankedEngine.startOverlay(location.search);</script>
    <script>
        (function() {
            var c = new URLSearchParams(location.search).get('color');
            if (c) {
                c = c.replace('#', '');
                if (/^[0-9a-fA-F]{6}$/.test(c)) {
                    var r = parseInt(c.substr(0, 2), 16);
                    var g = parseInt(c.substr(2, 2), 16);
                    var b = parseInt(c.substr(4, 2), 16);
                    document.documentElement.style.setProperty('--accent', '#' + c);
                    document.documentElement.style.setProperty('--accent-rgb', r + ', ' + g + ', ' + b);
                }
            }
        })();

        var POLL_MS      = RankedOverlay.config.refreshMs;
        var activeMode   = localStorage.getItem('fn_overlay_mode') || '';
        var modeBarBuilt = false;
        var curWin       = 'session';

        function $(s) { return document.querySelector(s); }

        // "3 WINS, 1 LOSS" under the card when the link has ?rec=1.
        var SHOW_REC = new URLSearchParams(location.search).get('rec') === '1';
        function renderRecordLine(d) {
            var el = $('#recLine');
            if (!el) return;
            if (!SHOW_REC || d.record_wins === undefined || d.record_wins === null) {
                el.style.display = 'none';
                return;
            }
            var w = Number(d.record_wins) || 0, l = Number(d.record_losses) || 0;
            el.innerHTML = '<span class="rec-in"><span class="rw">' + w + ' ' + (w === 1 ? 'WIN' : 'WINS') + '</span>'
                + '<span class="rs">,</span> '
                + '<span class="rl">' + l + ' ' + (l === 1 ? 'LOSS' : 'LOSSES') + '</span></span>';
            el.style.display = 'flex';
            // A long record shrinks to fit instead of widening the card.
            el.style.fontSize = '';
            var fs = 18, inner = el.firstChild;
            while (fs > 11 && inner.offsetWidth > el.clientWidth) { fs -= 1; el.style.fontSize = fs + 'px'; }
        }

        var INITIAL_CREATOR_CODE = RankedOverlay.config.creatorCode;
        // localStorage is shared by every overlay on localhost, so namespace the
        // keys per design and gate them on a signature of the server's config.
        // That way the wizard's choice (stats vs. code) and the configured code
        // always win on first load, and only an in-browser toggle for THIS
        // overlay persists, instead of one typed code bleeding across overlays.
        var FN_NS  = "Sharp";
        var K_MODE = 'fn_display_mode_' + FN_NS;
        var K_CODE = 'fn_creator_code_' + FN_NS;
        var K_SIG  = 'fn_config_sig_' + FN_NS;

        var displayMode, creatorCode;
        if (localStorage.getItem(K_SIG) === INITIAL_CREATOR_CODE) {
            displayMode = localStorage.getItem(K_MODE) || (INITIAL_CREATOR_CODE ? 'code' : 'stats');
            var _savedCode = localStorage.getItem(K_CODE);
            creatorCode = (_savedCode === null) ? INITIAL_CREATOR_CODE : _savedCode;
        } else {
            displayMode = INITIAL_CREATOR_CODE ? 'code' : 'stats';
            creatorCode = INITIAL_CREATOR_CODE;
            localStorage.setItem(K_SIG, INITIAL_CREATOR_CODE);
            localStorage.setItem(K_MODE, displayMode);
            localStorage.setItem(K_CODE, creatorCode);
        }

        function renderCreatorText() {
            var el = $('#creatorRowText') || $('#creatorRow');
            el.textContent = creatorCode ? ('Use Code ' + creatorCode + ' #ad') : '';
        }

        function applyDisplayMode() {
            var statsEl = $('#statsRow');
            var codeEl  = $('#creatorRow');
            var input   = $('#codeInput');
            if (displayMode === 'code') {
                statsEl.style.display = 'none';
                codeEl.style.display  = '';
                input.style.display   = '';
            } else {
                statsEl.style.display = '';
                codeEl.style.display  = 'none';
                input.style.display   = 'none';
            }
            $('#statsToggleBtn').classList.toggle('active', displayMode === 'stats');
            $('#codeToggleBtn').classList.toggle('active', displayMode === 'code');
        }

        $('#statsToggleBtn').addEventListener('click', function() {
            displayMode = 'stats';
            localStorage.setItem(K_MODE, displayMode);
            applyDisplayMode();
        });
        $('#codeToggleBtn').addEventListener('click', function() {
            displayMode = 'code';
            localStorage.setItem(K_MODE, displayMode);
            applyDisplayMode();
        });
        $('#codeInput').addEventListener('input', function(e) {
            creatorCode = e.target.value;
            localStorage.setItem(K_CODE, creatorCode);
            renderCreatorText();
        });
        $('#codeInput').value = creatorCode || '';
        renderCreatorText();
        applyDisplayMode();

        function buildModeBar(modes) {
            if (modeBarBuilt) return;
            modeBarBuilt = true;
            var bar = $('#modeBar');
            bar.innerHTML = '';
            modes.forEach(function(m) {
                var btn = document.createElement('button');
                btn.className   = 'mode-btn';
                btn.textContent = m.label;
                btn.dataset.key = m.key;
                btn.addEventListener('click', function() {
                    if (activeMode === m.key) return;
                    activeMode = m.key;
                    localStorage.setItem('fn_overlay_mode', activeMode);
                    document.querySelectorAll('#modeBar .mode-btn').forEach(function(b) {
                        b.classList.toggle('active', b.dataset.key === activeMode);
                    });
                    tick();
                });
                bar.appendChild(btn);
            });
        }

        function applyData(d) {
            if (!d || !d.rank_display) return;

            renderRecordLine(d);

            var errEl = $('#errorText');
            if (errEl) {
                if (d.error) {
                    errEl.textContent = d.error;
                    errEl.style.display = 'block';
                } else {
                    errEl.style.display = 'none';
                }
            }

            var rankEl = $('#rankText');
            rankEl.textContent = d.rank_display;
            if (d.is_unreal) {
                rankEl.className = 'rank-label unreal-rainbow';
            } else {
                rankEl.className = 'rank-label';
            }

            var rightSection = $('#rightSection');
            var progSection  = $('#progSection');
            var leftSubRow   = $('#leftSubRow');
            var nextLeft     = $('#nextLeft');

            if (d.is_unreal) {
                var eloStr = d.elo_text || '-- ELO';
                var eloEl  = $('#eloText');
                eloEl.textContent = eloStr;
                rightSection.style.display = '';
                progSection.style.display  = 'none';

                var gapEl  = $('#nextGap');
                var posEl  = $('#nextPos');
                if (d.next_gap && d.next_pos) {
                    gapEl.textContent = d.next_gap + ' ELO';
                    posEl.textContent = '#' + d.next_pos;
                    nextLeft.style.visibility = 'visible';
                } else {
                    gapEl.textContent = '-';
                    posEl.textContent = '#-';
                    nextLeft.style.visibility = 'hidden';
                }

                var sessEl = $('#sessionText');
                sessEl.textContent = d.session_text || '+0 TODAY';
                sessEl.className   = 'session-delta session-' + (d.session_sign || 'zero');
            } else {
                rightSection.style.display = 'none';
                progSection.style.display  = '';

                if (d.progression_pct !== null && d.progression_pct !== undefined) {
                    $('#progPct').textContent    = d.progression_pct + '%';
                    $('#progFill').style.width   = d.progression_pct + '%';
                }

                if (d.pct_to_next !== null && d.pct_to_next !== undefined) {
                    $('#nextGap').textContent = d.pct_to_next + '% TO NEXT';
                    $('#nextPos').textContent = '';
                    $('#nextToLabel').textContent = '';
                } else {
                    $('#nextGap').textContent     = '-';
                    $('#nextToLabel').textContent = 'TO';
                    $('#nextPos').textContent     = '#-';
                }
                nextLeft.style.visibility = 'visible';

                var sess2 = $('#sessionText2');
                sess2.textContent = d.session_text || '+0% TODAY';
                sess2.className   = 'session-delta session-' + (d.session_sign || 'zero');
            }

            if ($('#seasonKd')) {
                $('#seasonKd').textContent    = d.season_kd    != null ? d.season_kd    : '-';
                $('#seasonWr').textContent    = d.season_wr    != null ? d.season_wr    : '-';
                $('#seasonKills').textContent = d.season_kills != null ? d.season_kills : '-';
                $('#seasonWins').textContent  = d.season_wins  != null ? d.season_wins  : '-';
            }

            // OliTracker only publishes ELO for the ranks it tracks. Below that
            // there is no ELO and no leaderboard row to measure a gap against,
            // so hide those widgets rather than render empty placeholders.
            var _eloNA = !!d.elo_unavailable;
            ['#rightSection', '#nextLeft'].forEach(function(sel) {
                var el = document.querySelector(sel);
                if (el) el.classList.toggle('elo-na', _eloNA);
            });
            // No ELO means no gap either, so the gap row goes with it.
            var _gapNA = _eloNA || !!d.gap_unavailable;
            ['#nextLeft'].forEach(function(sel) {
                document.querySelectorAll(sel).forEach(function(el) {
                    el.classList.toggle('elo-na', _gapNA);
                });
            });

            var modes = d.modes_available;
            if (modes && modes.length > 0) {
                if (!activeMode) {
                    activeMode = d.active_mode_key || modes[0].key;
                }
                buildModeBar(modes);
                document.querySelectorAll('#modeBar .mode-btn').forEach(function(b) {
                    b.classList.toggle('active', b.dataset.key === activeMode);
                });
            }
        }

        function tick() {
            var url = '/data?window=' + curWin + (activeMode ? '&mode=' + encodeURIComponent(activeMode) : '');
            RankedOverlay.fetchData(url)
                .then(function(r) { return r.json(); })
                .then(applyData)
                .catch(function() {});
        }

        tick();
        RankedOverlay.onUpdate(tick);
    </script>
</body>
</html>
