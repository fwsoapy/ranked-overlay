<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Generated by tools/build.py from src/designs/Classic.html. Edit that file, not this one. -->
    <meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite Rank Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --accent: #3b82f6;
            --accent-rgb: 59, 130, 246;
            --accent-light: color-mix(in srgb, var(--accent) 65%, white);
        }

        body {
            background: transparent;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            height: 100vh;
            padding: 24px;
        }

        .wrap {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 0;
        }

        .overlay-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(6, 10, 20, 0.82);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(var(--accent-rgb), 0.18);
            border-top: 5px solid var(--accent);
            padding: 16px 24px 16px 20px;
            min-width: 400px;
            user-select: none;
        }

        .main-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 32px;
        }

        .rank-text {
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .rank-text .rank-name { color: #f0f6ff; }
        .rank-text .rank-num  { color: var(--accent); }

        .main-row-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .elo-text {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.02em;
        }

        .prog-inline {
            display: none;
            align-items: center;
            gap: 10px;
        }

        .prog-inline.visible { display: flex; }

        .prog-pct {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.02em;
            min-width: 48px;
            text-align: right;
        }

        .prog-track {
            width: 80px;
            height: 7px;
            background: rgba(var(--accent-rgb), 0.15);
            border-radius: 4px;
            overflow: hidden;
        }

        .prog-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .divider {
            height: 1px;
            background: rgba(var(--accent-rgb), 0.12);
        }

        .sub-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: rgba(185, 205, 245, 0.95);
            visibility: visible;
        }

        .sub-row.hidden { visibility: hidden; }

        .next-target {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .next-target .hi { color: #ffffff; }

        .session-pos  { font-size: 18px; color: #22c55e; }
        .session-neg  { font-size: 18px; color: #ef4444; }
        .session-zero { font-size: 18px; color: #ffffff; }

        .divider-mid {
            height: 1px;
            background: rgba(var(--accent-rgb), 0.12);
            visibility: visible;
        }

        .divider-mid.hidden { visibility: hidden; }

        .stats-row {
            display: flex;
            gap: 22px;
            min-height: 42px;
            align-items: center;
            margin-top: 6px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent-light);
        }

        .stat-value {
            font-size: 21px;
            font-weight: 700;
            color: #d8e8ff;
        }

        .creator-row {
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent);
            min-height: 42px;
            display: flex;
            align-items: center;
            margin-top: 6px;
        }

        .error-text {
            font-size: 11px;
            font-weight: 600;
            color: rgba(245, 166, 35, 0.9);
            text-align: center;
            line-height: 1.4;
            margin-top: 4px;
        }

        .mode-bar {
            display: flex;
            flex-direction: column;
            gap: 7px;
            width: 100%;
            margin-top: 50px;
        }

        .mode-btn {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.10em;
            color: rgba(220, 220, 220, 0.55);
            background: rgba(20, 20, 20, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 13px 18px;
            cursor: pointer;
            user-select: none;
            width: 100%;
            text-align: center;
            transition: color 0.12s, background 0.12s, border-color 0.12s;
        }

        .mode-btn:hover {
            color: rgba(255, 255, 255, 0.90);
            background: rgba(40, 40, 40, 0.95);
            border-color: rgba(255, 255, 255, 0.20);
        }

        .mode-btn.active {
            color: #ffffff;
            background: rgba(55, 55, 55, 0.98);
            border-color: rgba(255, 255, 255, 0.30);
        }
    
        #codeInput.mode-btn {
            text-align: left;
            cursor: text;
        }

        #codeInput.mode-btn::placeholder {
            color: rgba(220, 220, 220, 0.35);
        }
        /* Set when OliTracker has no ELO for this account (see elo_unavailable). */
        .elo-na { display: none !important; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="overlay-container">

            <div class="main-row">
                <div class="rank-text" id="rankText">- LOADING</div>
                <div class="main-row-right">
                    <div class="elo-text" id="eloText" style="display:none"></div>
                    <div class="prog-inline" id="progInline">
                        <div class="prog-track">
                            <div class="prog-fill" id="progFill" style="width:0%"></div>
                        </div>
                        <div class="prog-pct" id="progPct">0%</div>
                    </div>
                </div>
            </div>

            <div class="divider"></div>

            <div class="sub-row hidden" id="subRow">
                <div class="next-target">
                    <span id="nextLabel">NEXT</span>
                    <span class="hi" id="nextGap">-</span>
                    <span id="nextArrow">→</span>
                    <span class="hi" id="nextPos">#-</span>
                </div>
                <span class="session-zero" id="sessionText">+0 TODAY</span>
            </div>

            <div class="divider-mid hidden" id="divider2"></div>

            <div class="stats-row" id="statsRow">
                <div class="stat">
                    <div class="stat-label">KD</div>
                    <div class="stat-value" id="seasonKd">-</div>
                </div>
                <div class="stat">
                    <div class="stat-label">WIN%</div>
                    <div class="stat-value" id="seasonWr">-</div>
                </div>
                <div class="stat">
                    <div class="stat-label">KILLS</div>
                    <div class="stat-value" id="seasonKills">-</div>
                </div>
                <div class="stat">
                    <div class="stat-label">WINS</div>
                    <div class="stat-value" id="seasonWins">-</div>
                </div>
            </div>
            <div class="creator-row" id="creatorRow"></div>

        </div>

        <div class="error-text" id="errorText" style="display:none"></div>
        <div class="mode-bar" id="modeBar"></div>
        <div class="mode-bar" id="displayToggleBar">
            <button class="mode-btn" id="statsToggleBtn">Stats</button>
            <button class="mode-btn" id="codeToggleBtn">Creator Code</button>
            <input class="mode-btn" id="codeInput" type="text" placeholder="Enter creator code" style="display:none;">
        </div>
    </div>

    <script src="../engine.js?v=8d3cf72be1"></script>
    <script>window.RankedOverlay = RankedEngine.startOverlay(location.search);</script>
    <script>
        (function() {
            var c = new URLSearchParams(location.search).get('color');
            if (c) {
                c = c.replace('#', '');
                if (/^[0-9a-fA-F]{6}$/.test(c)) {
                    var r = parseInt(c.substr(0, 2), 16);
                    var g = parseInt(c.substr(2, 2), 16);
                    var b = parseInt(c.substr(4, 2), 16);
                    document.documentElement.style.setProperty('--accent', '#' + c);
                    document.documentElement.style.setProperty('--accent-rgb', r + ', ' + g + ', ' + b);
                }
            }
        })();

        var POLL_MS      = RankedOverlay.config.refreshMs;
        var activeMode   = localStorage.getItem('fn_overlay_mode') || '';
        var modeBarBuilt = false;

        function $(s) { return document.querySelector(s); }

        var INITIAL_CREATOR_CODE = RankedOverlay.config.creatorCode;
        // localStorage is shared by every overlay on localhost, so namespace the
        // keys per design and gate them on a signature of the server's config.
        // That way the wizard's choice (stats vs. code) and the configured code
        // always win on first load, and only an in-browser toggle for THIS
        // overlay persists, instead of one typed code bleeding across overlays.
        var FN_NS  = "Classic";
        var K_MODE = 'fn_display_mode_' + FN_NS;
        var K_CODE = 'fn_creator_code_' + FN_NS;
        var K_SIG  = 'fn_config_sig_' + FN_NS;

        var displayMode, creatorCode;
        if (localStorage.getItem(K_SIG) === INITIAL_CREATOR_CODE) {
            displayMode = localStorage.getItem(K_MODE) || (INITIAL_CREATOR_CODE ? 'code' : 'stats');
            var _savedCode = localStorage.getItem(K_CODE);
            creatorCode = (_savedCode === null) ? INITIAL_CREATOR_CODE : _savedCode;
        } else {
            displayMode = INITIAL_CREATOR_CODE ? 'code' : 'stats';
            creatorCode = INITIAL_CREATOR_CODE;
            localStorage.setItem(K_SIG, INITIAL_CREATOR_CODE);
            localStorage.setItem(K_MODE, displayMode);
            localStorage.setItem(K_CODE, creatorCode);
        }

        function renderCreatorText() {
            var el = $('#creatorRowText') || $('#creatorRow');
            el.textContent = creatorCode ? ('Use Code ' + creatorCode + ' #ad') : '';
        }

        function applyDisplayMode() {
            var statsEl = $('#statsRow');
            var codeEl  = $('#creatorRow');
            var input   = $('#codeInput');
            if (displayMode === 'code') {
                statsEl.style.display = 'none';
                codeEl.style.display  = '';
                input.style.display   = '';
            } else {
                statsEl.style.display = '';
                codeEl.style.display  = 'none';
                input.style.display   = 'none';
            }
            $('#statsToggleBtn').classList.toggle('active', displayMode === 'stats');
            $('#codeToggleBtn').classList.toggle('active', displayMode === 'code');
        }

        $('#statsToggleBtn').addEventListener('click', function() {
            displayMode = 'stats';
            localStorage.setItem(K_MODE, displayMode);
            applyDisplayMode();
        });
        $('#codeToggleBtn').addEventListener('click', function() {
            displayMode = 'code';
            localStorage.setItem(K_MODE, displayMode);
            applyDisplayMode();
        });
        $('#codeInput').addEventListener('input', function(e) {
            creatorCode = e.target.value;
            localStorage.setItem(K_CODE, creatorCode);
            renderCreatorText();
        });
        $('#codeInput').value = creatorCode || '';
        renderCreatorText();
        applyDisplayMode();

        function buildModeBar(modes) {
            if (modeBarBuilt) return;
            modeBarBuilt = true;
            var bar = $('#modeBar');
            bar.innerHTML = '';
            modes.forEach(function(m) {
                var btn = document.createElement('button');
                btn.className   = 'mode-btn';
                btn.textContent = m.label;
                btn.dataset.key = m.key;
                btn.addEventListener('click', function() {
                    if (activeMode === m.key) return;
                    activeMode = m.key;
                    localStorage.setItem('fn_overlay_mode', activeMode);
                    document.querySelectorAll('.mode-btn').forEach(function(b) {
                        b.classList.toggle('active', b.dataset.key === activeMode);
                    });
                    tick();
                });
                bar.appendChild(btn);
            });
        }

        function renderRankText(rankDisplay, isUnreal) {
            var el = $('#rankText');
            if (!rankDisplay || rankDisplay === '-') {
                el.innerHTML = '<span class="rank-name">-</span>';
                return;
            }
            if (isUnreal) {
                // "#79 UNREAL" → blue #79, white UNREAL
                var m = rankDisplay.match(/^(#\d+)\s+(.+)$/);
                if (m) {
                    el.innerHTML = '<span class="rank-num">' + m[1] + '</span> <span class="rank-name">' + m[2] + '</span>';
                } else {
                    el.innerHTML = '<span class="rank-name">' + rankDisplay + '</span>';
                }
            } else {
                // "GOLD II" or "ELITE III" → white name, blue numeral
                var m2 = rankDisplay.match(/^(.+?)\s+(I{1,3}|IV|V?I{0,3})$/);
                if (m2 && m2[2]) {
                    el.innerHTML = '<span class="rank-name">' + m2[1] + '</span> <span class="rank-num">' + m2[2] + '</span>';
                } else {
                    el.innerHTML = '<span class="rank-name">' + rankDisplay + '</span>';
                }
            }
        }

        function applyData(d) {
            if (!d || !d.rank_display) return;

            var errEl = $('#errorText');
            if (errEl) {
                if (d.error) {
                    errEl.textContent = d.error;
                    errEl.style.display = 'block';
                } else {
                    errEl.style.display = 'none';
                }
            }

            renderRankText(d.rank_display, d.is_unreal);

            var eloEl    = $('#eloText');
            var progEl   = $('#progInline');
            var subRow   = $('#subRow');
            var divider2 = $('#divider2');

            if (d.is_unreal && d.elo_text) {
                eloEl.textContent    = d.elo_text;
                eloEl.style.display  = '';
                progEl.classList.remove('visible');
            } else if (!d.is_unreal && d.progression_pct !== null && d.progression_pct !== undefined) {
                $('#progFill').style.width = d.progression_pct + '%';
                $('#progPct').textContent  = d.progression_pct + '%';
                progEl.classList.add('visible');
                eloEl.style.display = 'none';
            } else {
                eloEl.style.display = 'none';
                progEl.classList.remove('visible');
            }

            if (d.is_unreal) {
                $('#nextLabel').textContent = 'NEXT';
                $('#nextGap').textContent   = d.next_gap ? d.next_gap + ' ELO' : '-';
                $('#nextArrow').textContent = '→';
                $('#nextPos').textContent   = d.next_pos ? '#' + d.next_pos : '#-';
                var sessEl = $('#sessionText');
                sessEl.textContent = d.session_text || '+0 TODAY';
                sessEl.className   = 'session-' + (d.session_sign || 'zero');
                subRow.classList.remove('hidden');
                divider2.classList.remove('hidden');
            } else if (d.pct_to_next !== null && d.pct_to_next !== undefined) {
                $('#nextLabel').textContent = '';
                $('#nextGap').textContent   = d.pct_to_next + '% TO NEXT RANK';
                $('#nextArrow').textContent = '';
                $('#nextPos').textContent   = '';
                var sessEl = $('#sessionText');
                sessEl.textContent = d.session_text || '+0% TODAY';
                sessEl.className   = 'session-' + (d.session_sign || 'zero');
                subRow.classList.remove('hidden');
                divider2.classList.remove('hidden');
            } else {
                subRow.classList.add('hidden');
                divider2.classList.add('hidden');
            }

            $('#seasonKd').textContent    = d.season_kd    != null ? d.season_kd    : '-';
            $('#seasonWr').textContent    = d.season_wr    != null ? d.season_wr    : '-';
            $('#seasonKills').textContent = d.season_kills != null ? d.season_kills : '-';
            $('#seasonWins').textContent  = d.season_wins  != null ? d.season_wins  : '-';

            // OliTracker only publishes ELO for the ranks it tracks. Below that
            // there is no ELO and no leaderboard row to measure a gap against,
            // so hide those widgets rather than render empty placeholders.
            var _eloNA = !!d.elo_unavailable;
            ['#eloText', '#subRow', '#divider2'].forEach(function(sel) {
                var el = document.querySelector(sel);
                if (el) el.classList.toggle('elo-na', _eloNA);
            });
            // No ELO means no gap either, so the gap row goes with it.
            var _gapNA = _eloNA || !!d.gap_unavailable;
            ['#subRow .next-target'].forEach(function(sel) {
                document.querySelectorAll(sel).forEach(function(el) {
                    el.classList.toggle('elo-na', _gapNA);
                });
            });

            var modes = d.modes_available;
            if (modes && modes.length > 0) {
                if (!activeMode) {
                    activeMode = d.active_mode_key || modes[0].key;
                }
                buildModeBar(modes);
                document.querySelectorAll('.mode-btn').forEach(function(b) {
                    b.classList.toggle('active', b.dataset.key === activeMode);
                });
            }
        }

        function tick() {
            var url = '/data?window=session' + (activeMode ? '&mode=' + encodeURIComponent(activeMode) : '');
            RankedOverlay.fetchData(url)
                .then(function(r) { return r.json(); })
                .then(applyData)
                .catch(function() {});
        }

        tick();
        RankedOverlay.onUpdate(tick);
    </script>
</body>
</html>
