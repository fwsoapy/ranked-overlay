name: Build check

# docs/ (the website) is generated from src/ by tools/build.py. If someone
# edits a file in docs/ directly, the next build quietly overwrites it, so
# check on every push that docs/ is still exactly what src/ produces.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: docs/ matches src/
        run: python tools/build.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # src/web/engine.js is checked against the old Python server it was
      # ported from (archive/), on real OliTracker responses, and against its
      # request budget.
      - name: Website engine checks
        run: python tests/web/test_engine.py
