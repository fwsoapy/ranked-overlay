<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite Rank Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;900&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --accent: #dc2626;
            --accent-rgb: 220, 38, 38;
            --accent-light: color-mix(in srgb, var(--accent) 65%, white);
        }

        body {
            background: transparent;
            font-family: 'Barlow', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            height: 100vh;
            padding: 24px;
        }

        .wrap {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 12px;
        }

        .overlay-container {
            display: flex;
            flex-direction: column;
            background: rgba(8, 4, 4, 0.88);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(var(--accent-rgb), 0.22);
            border-left: 5px solid var(--accent);
            min-width: 400px;
            overflow: hidden;
            position: relative;
        }

        .overlay-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 90px; height: 90px;
            background: radial-gradient(circle at top left, rgba(var(--accent-rgb),0.18) 0%, transparent 70%);
            pointer-events: none;
        }

        .header-band {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px 20px 11px 18px;
            background: rgba(var(--accent-rgb), 0.10);
            border-bottom: 1px solid rgba(var(--accent-rgb), 0.18);
        }

        .rank-text {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            line-height: 1;
        }

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .elo-pill {
            background: rgba(var(--accent-rgb), 0.20);
            border: 1px solid rgba(var(--accent-rgb), 0.45);
            border-radius: 4px;
            padding: 3px 12px;
            display: none;
        }

        .elo-pill.visible { display: block; }

        .elo-text {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.04em;
            line-height: 1;
        }

        .prog-bar-wrap {
            display: none;
            flex-direction: row;
            align-items: center;
            gap: 10px;
        }

        .prog-bar-wrap.visible { display: flex; }

        .prog-label {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--accent);
            line-height: 1;
            min-width: 44px;
            text-align: right;
        }

        .prog-track {
            width: 80px;
            height: 7px;
            background: rgba(255, 255, 255, 0.10);
            border-radius: 4px;
            overflow: hidden;
        }

        .prog-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .mid-row {
            display: none;
            justify-content: space-between;
            align-items: center;
            padding: 7px 20px 7px 18px;
            border-bottom: 1px solid rgba(var(--accent-rgb), 0.10);
        }

        .mid-row.visible { display: flex; }

        .next-target {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--accent-light);
        }

        .next-target .arrow { color: var(--accent-light); font-size: 12px; }
        .next-target .hi    { color: #ffffff; }

        .session-pos  { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #4ade80; }
        .session-neg  { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #f87171; }
        .session-zero { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #ffffff; }

        .stats-row {
            display: flex;
            padding: 0 20px 0 18px;
            min-height: 58px;
            align-items: center;
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
            position: relative;
        }

        .stat + .stat::before {
            content: '';
            position: absolute;
            left: 0; top: 3px; bottom: 3px;
            width: 1px;
            background: rgba(var(--accent-rgb), 0.14);
        }

        .stat + .stat { padding-left: 18px; }

        .stat-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--accent-light);
            line-height: 1;
        }

        .stat-value {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #fff5f5;
            line-height: 1;
            letter-spacing: 0.02em;
        }

        .creator-row {
            padding: 0 20px 0 18px;
            min-height: 58px;
            display: flex;
            align-items: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 27px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--accent-light);
        }

        .error-text {
            font-size: 11px;
            font-weight: 600;
            color: rgba(245, 166, 35, 0.9);
            text-align: center;
            line-height: 1.4;
            margin-top: 4px;
        }

        .mode-bar {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-top: 10px;
            width: 100%;
        }

        .mode-btn {
            font-family: 'Barlow', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: rgba(220, 220, 220, 0.60);
            background: rgba(20, 20, 20, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 13px 18px;
            cursor: pointer;
            user-select: none;
            width: 100%;
            text-align: center;
            transition: color 0.12s, background 0.12s, border-color 0.12s;
        }

        .mode-btn:hover {
            color: rgba(255, 255, 255, 0.90);
            background: rgba(40, 40, 40, 0.95);
            border-color: rgba(255, 255, 255, 0.20);
        }

        .mode-btn.active {
            color: #ffffff;
            background: rgba(55, 55, 55, 0.98);
            border-color: rgba(255, 255, 255, 0.30);
        }
    
        #codeInput.mode-btn {
            text-align: left;
            cursor: text;
        }

        #codeInput.mode-btn::placeholder {
            color: rgba(220, 220, 220, 0.35);
        }
        /* Set when OliTracker has no ELO for this account (see elo_unavailable). */
        .elo-na { display: none !important; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="overlay-container">
            <div class="header-band">
                <div class="rank-text" id="rankText">- LOADING</div>
                <div class="header-right">
                    <div class="elo-pill" id="eloPill">
                        <div class="elo-text" id="eloText"></div>
                    </div>
                    <div class="prog-bar-wrap" id="progWrap">
                        <div class="prog-track">
                            <div class="prog-fill" id="progFill" style="width:0%"></div>
                        </div>
                        <div class="prog-label" id="progLabel">0%</div>
                    </div>
                </div>
            </div>

            <div class="mid-row" id="midRow">
                <div class="next-target">
                    <span>NEXT</span>
                    <span class="hi" id="nextGap">-</span>
                    <span class="arrow">▶</span>
                    <span class="hi" id="nextPos">#-</span>
                </div>
                <span class="session-zero" id="sessionText">+0 TODAY</span>
            </div>

            <div class="stats-row" id="statsRow">
                <div class="stat">
                    <div class="stat-label">K/D</div>
                    <div class="stat-value" id="seasonKd">-</div>
                </div>
                <div class="stat">
                    <div class="stat-label">WIN%</div>
                    <div class="stat-value" id="seasonWr">-</div>
                </div>
                <div class="stat">
                    <div class="stat-label">KILLS</div>
                    <div class="stat-value" id="seasonKills">-</div>
                </div>
                <div class="stat">
                    <div class="stat-label">WINS</div>
                    <div class="stat-value" id="seasonWins">-</div>
                </div>
            </div>
            <div class="creator-row" id="creatorRow"></div>
        </div>

        <div class="error-text" id="errorText" style="display:none"></div>
        <div class="mode-bar" id="modeBar"></div>
        <div class="mode-bar" id="displayToggleBar">
            <button class="mode-btn" id="statsToggleBtn">Stats</button>
            <button class="mode-btn" id="codeToggleBtn">Creator Code</button>
            <input class="mode-btn" id="codeInput" type="text" placeholder="Enter creator code" style="display:none;">
        </div>
    </div>

    <script>
        (function() {
            var c = new URLSearchParams(location.search).get('color');
            if (c) {
                c = c.replace('#', '');
                if (/^[0-9a-fA-F]{6}$/.test(c)) {
                    var r = parseInt(c.substr(0, 2), 16);
                    var g = parseInt(c.substr(2, 2), 16);
                    var b = parseInt(c.substr(4, 2), 16);
                    document.documentElement.style.setProperty('--accent', '#' + c);
                    document.documentElement.style.setProperty('--accent-rgb', r + ', ' + g + ', ' + b);
                }
            }
        })();

        var POLL_MS      = __POLL_MS__;
        var activeMode   = localStorage.getItem('fn_overlay_mode') || '';
        var modeBarBuilt = false;

        function $(s) { return document.querySelector(s); }

        var INITIAL_CREATOR_CODE = "__INITIAL_CREATOR_CODE__";
        // localStorage is shared by every overlay on localhost, so namespace the
        // keys per design and gate them on a signature of the server's config.
        // That way the wizard's choice (stats vs. code) and the configured code
        // always win on first load, and only an in-browser toggle for THIS
        // overlay persists, instead of one typed code bleeding across overlays.
        var FN_NS  = "Modern";
        var K_MODE = 'fn_display_mode_' + FN_NS;
        var K_CODE = 'fn_creator_code_' + FN_NS;
        var K_SIG  = 'fn_config_sig_' + FN_NS;

        var displayMode, creatorCode;
        if (localStorage.getItem(K_SIG) === INITIAL_CREATOR_CODE) {
            displayMode = localStorage.getItem(K_MODE) || (INITIAL_CREATOR_CODE ? 'code' : 'stats');
            var _savedCode = localStorage.getItem(K_CODE);
            creatorCode = (_savedCode === null) ? INITIAL_CREATOR_CODE : _savedCode;
        } else {
            displayMode = INITIAL_CREATOR_CODE ? 'code' : 'stats';
            creatorCode = INITIAL_CREATOR_CODE;
            localStorage.setItem(K_SIG, INITIAL_CREATOR_CODE);
            localStorage.setItem(K_MODE, displayMode);
            localStorage.setItem(K_CODE, creatorCode);
        }

        function renderCreatorText() {
            var el = $('#creatorRowText') || $('#creatorRow');
            el.textContent = creatorCode ? ('Use Code ' + creatorCode + ' #ad') : '';
        }

        function applyDisplayMode() {
            var statsEl = $('#statsRow');
            var codeEl  = $('#creatorRow');
            var input   = $('#codeInput');
            if (displayMode === 'code') {
                statsEl.style.display = 'none';
                codeEl.style.display  = '';
                input.style.display   = '';
            } else {
                statsEl.style.display = '';
                codeEl.style.display  = 'none';
                input.style.display   = 'none';
            }
            $('#statsToggleBtn').classList.toggle('active', displayMode === 'stats');
            $('#codeToggleBtn').classList.toggle('active', displayMode === 'code');
        }

        $('#statsToggleBtn').addEventListener('click', function() {
            displayMode = 'stats';
            localStorage.setItem(K_MODE, displayMode);
            applyDisplayMode();
        });
        $('#codeToggleBtn').addEventListener('click', function() {
            displayMode = 'code';
            localStorage.setItem(K_MODE, displayMode);
            applyDisplayMode();
        });
        $('#codeInput').addEventListener('input', function(e) {
            creatorCode = e.target.value;
            localStorage.setItem(K_CODE, creatorCode);
            renderCreatorText();
        });
        $('#codeInput').value = creatorCode || '';
        renderCreatorText();
        applyDisplayMode();

        function buildModeBar(modes) {
            if (modeBarBuilt) return;
            modeBarBuilt = true;
            var bar = $('#modeBar');
            bar.innerHTML = '';
            modes.forEach(function(m) {
                var btn = document.createElement('button');
                btn.className   = 'mode-btn';
                btn.textContent = m.label;
                btn.dataset.key = m.key;
                btn.addEventListener('click', function() {
                    if (activeMode === m.key) return;
                    activeMode = m.key;
                    localStorage.setItem('fn_overlay_mode', activeMode);
                    document.querySelectorAll('.mode-btn').forEach(function(b) {
                        b.classList.toggle('active', b.dataset.key === activeMode);
                    });
                    tick();
                });
                bar.appendChild(btn);
            });
        }

        function applyData(d) {
            if (!d || !d.rank_display) return;

            var errEl = $('#errorText');
            if (errEl) {
                if (d.error) {
                    errEl.textContent = d.error;
                    errEl.style.display = 'block';
                } else {
                    errEl.style.display = 'none';
                }
            }

            $('#rankText').textContent = d.rank_display;

            var pill     = $('#eloPill');
            var progWrap = $('#progWrap');
            var midRow   = $('#midRow');

            if (d.is_unreal && d.elo_text) {
                $('#eloText').textContent = d.elo_text;
                pill.classList.add('visible');
                progWrap.classList.remove('visible');
            } else if (!d.is_unreal && d.progression_pct !== null && d.progression_pct !== undefined) {
                var pct = d.progression_pct;
                $('#progLabel').textContent = pct + '%';
                $('#progFill').style.width  = pct + '%';
                progWrap.classList.add('visible');
                pill.classList.remove('visible');
            } else {
                pill.classList.remove('visible');
                progWrap.classList.remove('visible');
            }

            if (d.next_pos || d.session_text) {
                if (d.is_unreal) {
                    $('#nextGap').textContent = d.next_gap ? d.next_gap + ' ELO' : '-';
                    $('#nextPos').textContent = d.next_pos ? '#' + d.next_pos : '#-';
                } else {
                    $('#nextGap').textContent = d.next_gap || '-';
                    $('#nextPos').textContent = d.next_pos || '-';
                }
                var sessEl = $('#sessionText');
                sessEl.textContent = d.session_text || '+0 TODAY';
                sessEl.className   = 'session-' + (d.session_sign || 'zero');
                midRow.classList.add('visible');
            } else {
                midRow.classList.remove('visible');
            }

            $('#seasonKd').textContent    = d.season_kd    != null ? d.season_kd    : '-';
            $('#seasonWr').textContent    = d.season_wr    != null ? d.season_wr    : '-';
            $('#seasonKills').textContent = d.season_kills != null ? d.season_kills : '-';
            $('#seasonWins').textContent  = d.season_wins  != null ? d.season_wins  : '-';

            // OliTracker only publishes ELO for the ranks it tracks. Below that
            // there is no ELO and no leaderboard row to measure a gap against,
            // so hide those widgets rather than render empty placeholders.
            var _eloNA = !!d.elo_unavailable;
            ['#eloPill', '#midRow'].forEach(function(sel) {
                var el = document.querySelector(sel);
                if (el) el.classList.toggle('elo-na', _eloNA);
            });
            // No ELO means no gap either, so the gap row goes with it.
            var _gapNA = _eloNA || !!d.gap_unavailable;
            ['#midRow .next-target'].forEach(function(sel) {
                document.querySelectorAll(sel).forEach(function(el) {
                    el.classList.toggle('elo-na', _gapNA);
                });
            });

            var modes = d.modes_available;
            if (modes && modes.length > 0) {
                if (!activeMode) {
                    activeMode = d.active_mode_key || modes[0].key;
                }
                buildModeBar(modes);
                document.querySelectorAll('.mode-btn').forEach(function(b) {
                    b.classList.toggle('active', b.dataset.key === activeMode);
                });
            }
        }

        function tick() {
            var url = '/data?window=session' + (activeMode ? '&mode=' + encodeURIComponent(activeMode) : '');
            fetch(url, { cache: 'no-store' })
                .then(function(r) { return r.json(); })
                .then(applyData)
                .catch(function() {});
        }

        tick();
        setInterval(tick, POLL_MS);
    </script>
</body>
</html>
