<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite Rank Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --accent: #2dff91;
            --accent-rgb: 45, 255, 145;
            --accent-light: color-mix(in srgb, var(--accent) 65%, white);
        }

        body {
            background: transparent;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            height: 100vh;
            padding: 24px;
        }

        .wrap {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 0;
        }

        .overlay-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 22px;
            background: linear-gradient(135deg, rgba(5,16,11,0.95), rgba(2,8,6,0.97));
            border: 1px solid rgba(var(--accent-rgb),0.28);
            clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
            padding: 22px 28px;
            min-width: 460px;
            user-select: none;
            box-shadow: 0 0 0 1px rgba(var(--accent-rgb),0.05), 0 12px 32px rgba(0,0,0,0.55);
        }

        .corner {
            position: absolute;
            width: 16px;
            height: 16px;
            pointer-events: none;
        }
        .corner-tl {
            top: -1px; left: -1px;
            border-top: 2px solid var(--accent);
            border-left: 2px solid var(--accent);
            clip-path: polygon(0 0, 60% 0, 0 60%);
        }
        .corner-br {
            bottom: -1px; right: -1px;
            border-bottom: 2px solid var(--accent);
            border-right: 2px solid var(--accent);
            clip-path: polygon(100% 100%, 40% 100%, 100% 40%);
        }

        .ring-wrap {
            position: relative;
            width: 122px;
            height: 122px;
            flex-shrink: 0;
        }

        .ring-svg { width: 122px; height: 122px; }

        .ring-track {
            fill: none;
            stroke: rgba(var(--accent-rgb), 0.12);
            stroke-width: 9;
        }

        .ring-progress {
            fill: none;
            stroke: var(--accent);
            stroke-width: 9;
            stroke-linecap: round;
            stroke-dasharray: 364.4;
            stroke-dashoffset: 364.4;
            transform: rotate(-90deg);
            transform-origin: 61px 61px;
            transition: stroke-dashoffset 0.5s ease;
            filter: drop-shadow(0 0 5px rgba(var(--accent-rgb),0.65));
        }

        .ring-spin {
            animation: spin 7s linear infinite;
            transform-origin: 61px 61px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .ring-tick {
            fill: none;
            stroke: rgba(var(--accent-rgb), 0.35);
            stroke-width: 1;
            stroke-dasharray: 1.5 7.5;
        }

        .ring-center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .ring-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 27px;
            font-weight: 800;
            color: #eafff2;
            line-height: 1;
            letter-spacing: -0.01em;
        }

        .ring-unit {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.14em;
            color: var(--accent-light);
            text-transform: uppercase;
            margin-top: 3px;
        }

        .info-col {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .rank-big {
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.01em;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rank-big .rank-name { color: #eafff2; }
        .rank-big .rank-num  { color: var(--accent); }

        .next-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.01em;
            color: rgba(210, 255, 230, 0.85);
            text-transform: uppercase;
            visibility: visible;
        }

        .next-row.hidden { visibility: hidden; }

        .next-row .hi { color: #eafff2; font-weight: 700; }
        .next-row .br { color: var(--accent-light); }

        .session-pos  { color: #2ed573; }
        .session-neg  { color: #ff5c5c; }
        .session-zero { color: #ffffff; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, auto);
            align-items: center;
            gap: 16px;
            height: 52px;
            border-top: 1px solid rgba(var(--accent-rgb), 0.14);
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.10em;
            color: var(--accent-light);
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 21px;
            font-weight: 700;
            color: #eafff2;
        }

        .creator-row {
            height: 52px;
            display: flex;
            align-items: center;
            border-top: 1px solid rgba(var(--accent-rgb), 0.14);
            font-family: 'JetBrains Mono', monospace;
            font-size: 21px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent-light);
        }

        .error-text {
            font-size: 11px;
            font-weight: 600;
            color: rgba(245, 166, 35, 0.9);
            text-align: center;
            line-height: 1.4;
            margin-top: 4px;
        }

        .mode-bar {
            display: flex;
            flex-direction: column;
            gap: 7px;
            width: 100%;
            margin-top: 50px;
        }

        .mode-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.10em;
            color: rgba(220, 220, 220, 0.55);
            background: rgba(20, 20, 20, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 13px 18px;
            cursor: pointer;
            user-select: none;
            width: 100%;
            text-align: center;
            transition: color 0.12s, background 0.12s, border-color 0.12s;
        }

        .mode-btn:hover {
            color: rgba(255, 255, 255, 0.90);
            background: rgba(40, 40, 40, 0.95);
            border-color: rgba(var(--accent-rgb), 0.30);
        }

        .mode-btn.active {
            color: var(--accent);
            background: rgba(18, 48, 35, 0.95);
            border-color: rgba(var(--accent-rgb), 0.55);
        }
    
        #codeInput.mode-btn {
            text-align: left;
            cursor: text;
        }

        #codeInput.mode-btn::placeholder {
            color: rgba(220, 220, 220, 0.35);
        }
        /* Set when OliTracker has no ELO for this account (see elo_unavailable). */
        .elo-na { display: none !important; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="overlay-container">
            <div class="corner corner-tl"></div>
            <div class="corner corner-br"></div>

            <div class="ring-wrap">
                <svg class="ring-svg" viewBox="-8 -8 138 138">
                    <circle class="ring-tick ring-spin" cx="61" cy="61" r="58"></circle>
                    <circle class="ring-track" cx="61" cy="61" r="58"></circle>
                    <circle class="ring-progress" id="ringProgress" cx="61" cy="61" r="58"></circle>
                </svg>
                <div class="ring-center">
                    <div class="ring-value" id="ringValue">--</div>
                    <div class="ring-unit" id="ringUnit">ELO</div>
                </div>
            </div>

            <div class="info-col">
                <div class="rank-big" id="rankText">- LOADING</div>

                <div class="next-row hidden" id="nextRow">
                    <span id="nextLabel">NEXT</span>
                    <span class="hi" id="nextGap">-</span>
                    <span class="br" id="nextArrow">TO</span>
                    <span class="hi" id="nextPos">#-</span>
                    <span class="br">|</span>
                    <span class="session-zero" id="sessionText">+0 TODAY</span>
                </div>

                <div class="stats-grid" id="statsRow">
                    <div class="stat">
                        <div class="stat-label">KD</div>
                        <div class="stat-value" id="seasonKd">-</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">WIN%</div>
                        <div class="stat-value" id="seasonWr">-</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">KILLS</div>
                        <div class="stat-value" id="seasonKills">-</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">WINS</div>
                        <div class="stat-value" id="seasonWins">-</div>
                    </div>
                </div>
                <div class="creator-row" id="creatorRow"></div>
            </div>
        </div>

        <div class="error-text" id="errorText" style="display:none"></div>
        <div class="mode-bar" id="modeBar"></div>
        <div class="mode-bar" id="displayToggleBar">
            <button class="mode-btn" id="statsToggleBtn">Stats</button>
            <button class="mode-btn" id="codeToggleBtn">Creator Code</button>
            <input class="mode-btn" id="codeInput" type="text" size="1" placeholder="Enter creator code" style="display:none;">
        </div>
    </div>

    <script>
        (function() {
            var c = new URLSearchParams(location.search).get('color');
            if (c) {
                c = c.replace('#', '');
                if (/^[0-9a-fA-F]{6}$/.test(c)) {
                    var r = parseInt(c.substr(0, 2), 16);
                    var g = parseInt(c.substr(2, 2), 16);
                    var b = parseInt(c.substr(4, 2), 16);
                    document.documentElement.style.setProperty('--accent', '#' + c);
                    document.documentElement.style.setProperty('--accent-rgb', r + ', ' + g + ', ' + b);
                }
            }
        })();

        var POLL_MS      = __POLL_MS__;
        var activeMode   = localStorage.getItem('fn_overlay_mode') || '';
        var modeBarBuilt = false;
        var RING_CIRC    = 364.4;

        function $(s) { return document.querySelector(s); }

        var INITIAL_CREATOR_CODE = "__INITIAL_CREATOR_CODE__";
        // localStorage is shared by every overlay on localhost, so namespace the
        // keys per design and gate them on a signature of the server's config.
        // That way the wizard's choice (stats vs. code) and the configured code
        // always win on first load, and only an in-browser toggle for THIS
        // overlay persists, instead of one typed code bleeding across overlays.
        var FN_NS  = "Pulse";
        var K_MODE = 'fn_display_mode_' + FN_NS;
        var K_CODE = 'fn_creator_code_' + FN_NS;
        var K_SIG  = 'fn_config_sig_' + FN_NS;

        var displayMode, creatorCode;
        if (localStorage.getItem(K_SIG) === INITIAL_CREATOR_CODE) {
            displayMode = localStorage.getItem(K_MODE) || (INITIAL_CREATOR_CODE ? 'code' : 'stats');
            var _savedCode = localStorage.getItem(K_CODE);
            creatorCode = (_savedCode === null) ? INITIAL_CREATOR_CODE : _savedCode;
        } else {
            displayMode = INITIAL_CREATOR_CODE ? 'code' : 'stats';
            creatorCode = INITIAL_CREATOR_CODE;
            localStorage.setItem(K_SIG, INITIAL_CREATOR_CODE);
            localStorage.setItem(K_MODE, displayMode);
            localStorage.setItem(K_CODE, creatorCode);
        }

        function renderCreatorText() {
            var el = $('#creatorRowText') || $('#creatorRow');
            el.textContent = creatorCode ? ('Use Code ' + creatorCode + ' #ad') : '';
        }

        function applyDisplayMode() {
            var statsEl = $('#statsRow');
            var codeEl  = $('#creatorRow');
            var input   = $('#codeInput');
            if (displayMode === 'code') {
                statsEl.style.display = 'none';
                codeEl.style.display  = '';
                input.style.display   = '';
            } else {
                statsEl.style.display = '';
                codeEl.style.display  = 'none';
                input.style.display   = 'none';
            }
            $('#statsToggleBtn').classList.toggle('active', displayMode === 'stats');
            $('#codeToggleBtn').classList.toggle('active', displayMode === 'code');
        }

        $('#statsToggleBtn').addEventListener('click', function() {
            displayMode = 'stats';
            localStorage.setItem(K_MODE, displayMode);
            applyDisplayMode();
        });
        $('#codeToggleBtn').addEventListener('click', function() {
            displayMode = 'code';
            localStorage.setItem(K_MODE, displayMode);
            applyDisplayMode();
        });
        $('#codeInput').addEventListener('input', function(e) {
            creatorCode = e.target.value;
            localStorage.setItem(K_CODE, creatorCode);
            renderCreatorText();
        });
        $('#codeInput').value = creatorCode || '';
        renderCreatorText();
        applyDisplayMode();

        function setRing(pct) {
            var clamped = Math.max(0, Math.min(100, pct));
            var offset = RING_CIRC - (RING_CIRC * clamped / 100);
            $('#ringProgress').style.strokeDashoffset = offset;
        }

        function buildModeBar(modes) {
            if (modeBarBuilt) return;
            modeBarBuilt = true;
            var bar = $('#modeBar');
            bar.innerHTML = '';
            modes.forEach(function(m) {
                var btn = document.createElement('button');
                btn.className   = 'mode-btn';
                btn.textContent = m.label;
                btn.dataset.key = m.key;
                btn.addEventListener('click', function() {
                    if (activeMode === m.key) return;
                    activeMode = m.key;
                    localStorage.setItem('fn_overlay_mode', activeMode);
                    document.querySelectorAll('#modeBar .mode-btn').forEach(function(b) {
                        b.classList.toggle('active', b.dataset.key === activeMode);
                    });
                    tick();
                });
                bar.appendChild(btn);
            });
        }

        function renderRankText(rankDisplay, isUnreal) {
            var el = $('#rankText');
            if (!rankDisplay || rankDisplay === '-') {
                el.innerHTML = '<span class="rank-name">-</span>';
                return;
            }
            if (isUnreal) {
                var m = rankDisplay.match(/^(#\d+)\s+(.+)$/);
                if (m) {
                    el.innerHTML = '<span class="rank-num">' + m[1] + '</span> <span class="rank-name">' + m[2] + '</span>';
                } else {
                    el.innerHTML = '<span class="rank-name">' + rankDisplay + '</span>';
                }
            } else {
                var m2 = rankDisplay.match(/^(.+?)\s+(I{1,3}|IV|V?I{0,3})$/);
                if (m2 && m2[2]) {
                    el.innerHTML = '<span class="rank-name">' + m2[1] + '</span> <span class="rank-num">' + m2[2] + '</span>';
                } else {
                    el.innerHTML = '<span class="rank-name">' + rankDisplay + '</span>';
                }
            }
        }

        function applyData(d) {
            if (!d || !d.rank_display) return;

            var errEl = $('#errorText');
            if (errEl) {
                if (d.error) {
                    errEl.textContent = d.error;
                    errEl.style.display = 'block';
                } else {
                    errEl.style.display = 'none';
                }
            }

            renderRankText(d.rank_display, d.is_unreal);

            var nextRow = $('#nextRow');

            if (d.is_unreal && d.elo_text) {
                var num = (d.elo_text.match(/-?\d+/) || ['--'])[0];
                $('#ringValue').textContent = num;
                $('#ringUnit').textContent  = 'ELO';
                setRing(100);
            } else if (!d.is_unreal && d.progression_pct !== null && d.progression_pct !== undefined) {
                $('#ringValue').textContent = d.progression_pct;
                $('#ringUnit').textContent  = '% RANK UP';
                setRing(d.progression_pct);
            } else {
                $('#ringValue').textContent = '--';
                $('#ringUnit').textContent  = '';
                setRing(0);
            }

            if (d.is_unreal) {
                $('#nextLabel').textContent = 'NEXT';
                $('#nextGap').textContent   = d.next_gap ? d.next_gap + ' ELO' : '-';
                $('#nextArrow').textContent = 'TO';
                $('#nextPos').textContent   = d.next_pos ? '#' + d.next_pos : '#-';
                var sessEl = $('#sessionText');
                sessEl.textContent = d.session_text || '+0 TODAY';
                sessEl.className   = 'session-' + (d.session_sign || 'zero');
                nextRow.classList.remove('hidden');
            } else if (d.pct_to_next !== null && d.pct_to_next !== undefined) {
                $('#nextLabel').textContent = '';
                $('#nextGap').textContent   = d.pct_to_next + '% TO NEXT';
                $('#nextArrow').textContent = '';
                $('#nextPos').textContent   = '';
                var sessEl2 = $('#sessionText');
                sessEl2.textContent = d.session_text || '+0% TODAY';
                sessEl2.className   = 'session-' + (d.session_sign || 'zero');
                nextRow.classList.remove('hidden');
            } else {
                nextRow.classList.add('hidden');
            }

            $('#seasonKd').textContent    = d.season_kd    != null ? d.season_kd    : '-';
            $('#seasonWr').textContent    = d.season_wr    != null ? d.season_wr    : '-';
            $('#seasonKills').textContent = d.season_kills != null ? d.season_kills : '-';
            $('#seasonWins').textContent  = d.season_wins  != null ? d.season_wins  : '-';

            // OliTracker only publishes ELO for the ranks it tracks. Below that
            // there is no ELO and no leaderboard row to measure a gap against,
            // so hide those widgets rather than render empty placeholders.
            var _eloNA = !!d.elo_unavailable;
            ['.ring-wrap', '#nextRow'].forEach(function(sel) {
                var el = document.querySelector(sel);
                if (el) el.classList.toggle('elo-na', _eloNA);
            });
            // No ELO means no gap either, so the gap row goes with it.
            var _gapNA = _eloNA || !!d.gap_unavailable;
            ['#nextLabel', '#nextGap', '#nextArrow', '#nextPos', '#nextRow > .br:not(#nextArrow)'].forEach(function(sel) {
                document.querySelectorAll(sel).forEach(function(el) {
                    el.classList.toggle('elo-na', _gapNA);
                });
            });

            var modes = d.modes_available;
            if (modes && modes.length > 0) {
                if (!activeMode) {
                    activeMode = d.active_mode_key || modes[0].key;
                }
                buildModeBar(modes);
                document.querySelectorAll('#modeBar .mode-btn').forEach(function(b) {
                    b.classList.toggle('active', b.dataset.key === activeMode);
                });
            }
        }

        function tick() {
            var url = '/data?window=session' + (activeMode ? '&mode=' + encodeURIComponent(activeMode) : '');
            fetch(url, { cache: 'no-store' })
                .then(function(r) { return r.json(); })
                .then(applyData)
                .catch(function() {});
        }

        tick();
        setInterval(tick, POLL_MS);
    </script>
</body>
</html>
